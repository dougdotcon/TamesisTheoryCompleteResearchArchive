      triados com motor Riemann-Siegel proprio validado (bug real de
      precisao float64 encontrado e corrigido na validacao, run falho
      preservado). Item 5 (momentos de zeta): k=3 fica 13-18x acima do
      termo lider Keating-Snaith em T acessivel (termos de ordem
      inferior dominam) -- NAO priorizar (teste real = replicar
      polinomio CFKRS ja publicado). Item 6 (CLT de Selberg):
      variancia empirica fica entre os dois modelos nomeados, ~11
      sigma de ambos -- observavel nao-informativo sem modelo de
      correcao de altura finita, NAO priorizar. Item 10 (maximos FHK
