    time: {unit: s, interval: {min: 0, max: null}}
  restrictions: ["H0 values are dataset/model dependent"]
control_parameters: [scale_factor, energy_density, equation_of_state]
limiting_cases: [unspecified]
relations_to_other_regimes: [cosmological_initial]
epistemic_status: conjectured
references: [{id: hubble_anomaly_sources, type: observational, citation: "dataset-specific H0 inference"}]
provenance: {source_type: hypothesis_registry, source: internal_atlas_v0_1}
