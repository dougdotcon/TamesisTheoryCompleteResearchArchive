    epsilon_machine_complexity_gap_closing_result: >
      2026-08-21: usuario pediu para fechar o segundo e ultimo candidato
      da Fase 0.8, complexidade estatistica de ε-machines (C_mu,
      mecanica computacional de Crutchfield & Young 1989). Decisao de
      governanca tomada ANTES do despacho: o dominio do genoma de E.
      coli (espacial, nao temporal) NAO foi usado; um segundo dominio
      genuinamente temporal foi buscado e verificado com sucesso
      (sequencia de interevento sismico da erupcao de Cumbre Vieja, La
      Palma 2021, catalogo EMSC/IGN, 1.049 eventos PRE + 6.747 eventos
      POST). Metodologia fixada em METHODOLOGY_NOTE.md ANTES de qualquer
      calculo real: CSSR de L fixo com varredura de convergencia
      L_max∈{1,...,8}, gate de rejeicao obrigatorio
      (DEGENERATE/NOT_CONVERGENT/NOT_DETERMINISTIC), I(X)=C_mu primario
      + h_mu companheiro REBAIXADO a priori, checagem BSI companheira,
      substitutos IAAFT + bootstrap pre-autorizado. VALIDACAO SINTETICA:
      diagnosticos de correcao de codigo passaram (qui-quadrado,
      processo periodo-2, cadeia de Markov de 1a ordem a mao
      computavel) -- achado honesto adicional: o Processo Even revelou
      uma limitacao estrutural da simplificacao de escopo desta
      implementacao (clustering de L fixo, nao CSSR incremental
      completo), reportada sem esconder. Unica correcao pre-autorizada
      aplicada (exclusao de L=1, matematicamente trivial/nao-
      discriminante, confirmado empiricamente). Apos a correcao, 4
      controles positivos independentes rodados a orcamento completo:
      C_mu (canal primario) NAO mostrou poder discriminativo real em
      NENHUM dos 3 controles computaveis, nem apos o fallback de
      bootstrap (mesmo padrao exato ja visto no LZC_median de
      lempel_ziv_complexity). h_mu (companheiro, ja rebaixado a priori)
      mostrou poder real nos 3 controles positivos mas disparou um FALSO
      POSITIVO espurio no controle negativo -- nao pode ser promovido
      como substituto do canal primario. FECHADO NA ETAPA DE VALIDACAO
      -- dado real (Old Faithful, La Palma 2021) nunca tocado, apesar de
      ambos verificados como acessiveis e de boa qualidade. Nota
      interpretativa honesta: a ambiguidade entre limitacao especifica
      desta implementacao vs. fragilidade mais geral do estimador C_mu
      em amostra finita nao pode ser resolvida com o orcamento desta
      tarefa. Achado epistemologico para a linha inteira, nomeado a
      priori e retomado: C_mu e C_JS (entropia de permutacao, ja
      fechado negativo 8/8) pertencem a MESMA familia estrategica de
      medidas de complexidade em pico -- a estrategia inteira acumula
      agora 2/2 tentativas sem produzir invariante cross-domain
      sobrevivente nesta linha. 16o candidato desta linha a fechar sem
      invariante sobrevivente -- e o 4o a fechar na etapa de validacao
      (junto com RQA, homologia persistente, maior expoente de
      Lyapunov). Detalhes completos: 02_TESTS/TRI_RG/
      epsilon_machine_complexity/
      {METHODOLOGY_NOTE.md,VALIDATION_NOTE.md,RESULTS_SUMMARY.md}.
    epsilon_machine_complexity_v2_revision_result: >
      2026-08-21 (DISC-DEC-011 -> DISC-DEC-012): revisao delimitada
      concluida. CSSR incremental completo (Shalizi & Klinkner 2004)
      substituiu o clustering guloso de L fixo em analysis/em_common.py.
      I(X) (C_mu primario, h_mu companheiro/diagnostico) e o protocolo
      de significancia permaneceram exatamente inalterados.
      VERIFICACAO DE CORRECAO: um NOVO diagnostico decisivo (cadeia de
      Markov de 2a ordem genuina, N=300.000, solucao teorica exata) foi
      recuperado EXATAMENTE (4 estados, C_mu=1,8102 vs. teoria 1,8113)
      -- confirma que o motor GROW+DETERMINIZE esta correto. O Processo
      Even (teste decisivo do proprio artigo de Shalizi & Klinkner)
      continuou nao convergindo para a topologia minima verdadeira (2
      estados) dentro do orcamento L_max<=8 travado a priori -- mas
      desta vez com uma explicacao matematicamente PROVADA (nao vaga):
      derivacao analitica via matriz de transicao sub-estocastica
      mostrando que o ramo "corrida constante de 1s" tem alternacao
      periodo-2 nunca decadente, resolvivel apenas em L~15-20+, muito
      alem do orcamento autorizado -- confirmada numericamente a 4
      digitos significativos ate N=2 milhoes (propriedade do fenomeno,
      nao bug de implementacao). Os 4 controles positivos deram p_C_mu
      PRATICAMENTE IDENTICOS a V1 (0,735/0,4/1,0-direcao-errada/
      DEGENERATE); fallback de bootstrap identico (p=0,595). ACHADO
      NOVO: um controle negativo que V1 nao conseguia computar
      (bloqueado por NOT_DETERMINISTIC) agora e computavel sob CSSR
      completo e revela um NOVO falso positivo em C_mu (p=0,005) --
      REFORCANDO a conclusao de fragilidade do estimador. VEREDITO: a
      ambiguidade honesta do fechamento original (limitacao de
      implementacao vs. fragilidade generica do estimador) esta agora
      RESOLVIDA DE FORMA DECISIVA a favor da segunda explicacao --
      implementacao demonstravelmente correta, poder discriminativo
      ainda ausente. FECHADO NA ETAPA DE VALIDACAO novamente, desta vez
      com maior confianca -- dado real (Old Faithful, La Palma 2021)
      nunca tocado nem na sessao original nem nesta revisao. Uma futura
      revisita legitima exigiria uma medida de complexidade
      fundamentalmente diferente de C_mu (nova candidatura, fora do
      escopo desta revisao). Detalhes completos:
      02_TESTS/TRI_RG/epsilon_machine_complexity/
      {VALIDATION_NOTE_V2.md,RESULTS_SUMMARY_V2.md}.
