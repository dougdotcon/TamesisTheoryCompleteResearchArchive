      (N=1000, bicaudal, seed=12345), com escalada para nulo ETAS
      subcritico reservada condicionalmente ao tamanho do efeito em
      sismologia; mitigacao de STAI via Mc conservador (max(Mc_PRE,
      Mc_POST)+0,2, tecnica de maxima curvatura) em vez de buffer
      temporal arbitrario; janela de flares solares restrita ao arquivo
      de instrumento unico (fase de declinio do ciclo 24, 2014->2017)
      para evitar a transicao de satelite GOES ja identificada como
      risco. Proximo passo: construir e validar a pipeline contra dado
      sintetico antes de tocar dado real.
