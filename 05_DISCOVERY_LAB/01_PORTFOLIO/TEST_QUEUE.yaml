      imediatamente por 140 min continuos de apneia/hipopneia, dentro do
      MESMO registro do MESMO paciente, rotulo minuto-a-minuto de fonte
      clinica EXTERNA (escore humano de sinais respiratorios/SpO2,
      independente do ECG). Verificado por download real (.hea/.dat/.apn/
      .qrs, wfdb 4.3.1, alinhamento amostra-rotulo confirmado exato).
      PRE=2.747 intervalos RR, POST=9.195 intervalos RR -- volume amostral
      generoso. Registros de backup mapeados no mesmo banco (a18, a14, a01)
      para replicacao futura. Palavra "apnea" nao aparecia em nenhum
      arquivo do laboratorio antes desta busca -- dominio genuinamente
      novo. Teste de viabilidade EXPLORATORIO (pipeline nao validada, regra
      de janela ad hoc = limites exatos do rotulo clinico): alpha(PRE)=
      1,133, alpha(POST completo)=0,840, alpha(POST truncado)=0,929 --
      NAO e o resultado final, apenas confirma que o dominio e viavel.
      Ressalva honesta: apneia obstrutiva e um processo CICLICO (nao um
      evento discreto unico como onset de FV/crise), declarada
      explicitamente na metodologia de fechamento. Segundo dominio
      cross-domain escolhido: paleoclima GISP2 (reaproveitado de
      critical-slowing-down, mesma transicao Younger Dryas->Preboreal,
      mesmo dado ja baixado e verificado). Metodologia completa de
      fechamento de gaps (regra de escala DFA, definicao PRE/POST,
      protocolo IAAFT bicaudal, validacao sintetica obrigatoria antes do
      calculo final) fixada em
