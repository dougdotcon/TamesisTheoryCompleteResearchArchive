      -- aos 3 candidatos como um dominio fisiologico novo, nao so
      replicacao de DFA. As 3 pipelines ja validadas foram aplicadas sem
      modificacao aos 3 registros. RESULTADO: nao resolveu a exigencia
      cross-domain (os registros de backup sao do MESMO dominio ja
      testado em a04, nao um dominio fisico distinto). CSD continuou sem
