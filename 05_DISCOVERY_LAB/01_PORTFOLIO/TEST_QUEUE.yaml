      pela prova condicional de Lugar-Milinovich-Quesada-Herrera 2022,
      arXiv:2211.14918) como modelos concorrentes nomeados para a
      variancia do numero V(L) de zeros reais de zeta. Formulas
      verificadas por fetch direto do PDF fonte (nao de memoria).
      Estimador exato (integracao de funcao em escada, sem discretizacao)
      substituindo o ad hoc de um piloto exploratorio anterior. Validado
      contra rede regular, processo de Poisson e forca bruta ANTES de
