schema: tamesis-discovery-lab-test-queue/1
# Ciclo de vida de status (ver ../00_GOVERNANCE/RESEARCH_PIPELINE.md):
#   CANDIDATE_FORMULATING -> CANDIDATE_LOCKED -> ANALYZED ->
#   ADVERSARIALLY_REVIEWED -> (REPLICATION_PENDING -> REPLICATION_PASSED |
#   REPLICATION_FAILED) | CLOSED_{REFUTED,NULL,INCONCLUSIVE,OUT_OF_DOMAIN}
# CLOSED_* nao e derrota -- e informacao, catalogada com o mesmo peso que
# REPLICATION_PASSED.
#
# REPLICATION_PASSED e um terminus valido por si so -- NAO implica
# PROMOTED_TO_FORMAL_LAB automaticamente. So faz sentido promover a
# 04_FORMAL_RESEARCH_LAB (Lean) um candidato cujo nucleo seja uma
# afirmacao matematica demonstravel (ex. RH-REAL, ou um invariante formal
# de TRI/RG). Um achado empirico/estatistico (ex. linha SPARC-*) nao tem
# teorema para extrair -- REPLICATION_PASSED e seu estado final legitimo,
# catalogado como achado empirico replicado, sem passagem por Lean.
queue:
  - test_id: DISC-COSMOLOGY-MOND-SPARC-001
    title: "Auditoria + refazimento do teste EFE/SPARC legado com dado real e pre-registro"
    domain: cosmologia_observacional
    parent_legacy: "01_TAMESIS_CORE/02_Experimental_Validation/MOND_EFE/efe/simulations/sparc_real_download.py"
    status: CLOSED_INCONCLUSIVE
    existing_assets:
      - "02_TESTS/COSMOLOGY_MOND_SPARC/AUDIT_LEGACY_MOND_EFE_SPARC.md"
      - "02_TESTS/COSMOLOGY_MOND_SPARC/data/PROVENANCE.md"
      - "02_TESTS/COSMOLOGY_MOND_SPARC/PREREGISTRATION.md"
      - "02_TESTS/COSMOLOGY_MOND_SPARC/analysis/run_preregistered_analysis.py"
      - "02_TESTS/COSMOLOGY_MOND_SPARC/analysis/result_primary.json"
      - "02_TESTS/COSMOLOGY_MOND_SPARC/analysis/adversarial_reproduction.py"
      - "02_TESTS/COSMOLOGY_MOND_SPARC/analysis/result_adversarial.json"
    result_summary: >
      Analise pre-registrada rodada sobre dado real (175 galaxias SPARC,
      classificacao de ambiente via campo nativo f_D=4 "Ursa Major Cluster
      of Galaxies", N=28 aglomerado vs N=147 campo): inclinacao externa
      media do aglomerado mais negativa que a do campo (+0.078 vs +0.149),
      teste t de Welch de uma cauda p=0.049373 -- tecnicamente cruza o
      limiar pre-registrado de p<0.05 na direcao prevista pelo EFE, mas
      cai exatamente na "zona fragil" (0.04-0.06) que o proprio
      pre-registro (Secao 5) exigia declarar como fragil a priori.
      Reexecucao adversarial independente (agente separado, codigo
      proprio) reproduziu os numeros exatamente e nao encontrou bugs, mas
      identificou que o resultado depende de 4 galaxias de campo cuja
      "inclinacao externa" e um ajuste de apenas 2 pontos (residuo zero,
      alavancagem maxima); excluindo essas 4 galaxias (checagem de
      robustez informativa, nao um novo teste pre-registrado), p sobe
      para 0.0635 e o mesmo criterio inverte para "nao suporta EFE".
    adversarial_verdict: INCONCLUSIVE
    next_action: >
      Nenhuma acao pendente neste teste. Um novo teste EFE mais robusto
      (amostra maior, correcao de leverage, ou desenho de Chae et al. 2020
      usando estimativas de campo externo em vez do outer-slope aglomerado
      vs campo) exigiria um NOVO pre-registro, nao uma reformulacao deste.
    stop_condition: >
      [historico, ja cumprido] inventar uma previsao Tamesis sem citar a
      fonte teorica exata; formular ou reformular o pre-registro depois de
      olhar os dados reais; reusar qualquer numero ou alegacao dos scripts
      legados sem re-derivar do dado bruto real.

  - test_id: DISC-COSMOLOGY-MOND-SPARC-002
    title: "PIVOTADO 2026-08-12 (DISC-DEC-004): qual derivacao interna de a0 sobrevive ao dado real SPARC"
    domain: cosmologia_observacional
    parent_legacy: null
    related_tests:
      - "DISC-COSMOLOGY-MOND-SPARC-001 (fechado CLOSED_INCONCLUSIVE -- teste de diferenca de grupo, metodologicamente distinto deste)"
    status: REPLICATION_FAILED
    replication_gate_outcome: REPLICATION_FAILED_INCONCLUSIVE
    existing_assets:
      - "02_TESTS/COSMOLOGY_A0_DERIVATION/PREREGISTRATION.md"
      - "02_TESTS/COSMOLOGY_A0_DERIVATION/data/PROVENANCE.md"
      - "02_TESTS/COSMOLOGY_A0_DERIVATION/data/discovery_holdout_split.json"
      - "02_TESTS/COSMOLOGY_A0_DERIVATION/analysis/run_preregistered_analysis.py"
      - "02_TESTS/COSMOLOGY_A0_DERIVATION/analysis/result_primary.json"
      - "02_TESTS/COSMOLOGY_A0_DERIVATION/analysis/adversarial_reproduction.py"
      - "02_TESTS/COSMOLOGY_A0_DERIVATION/analysis/result_adversarial.json"
      - "02_TESTS/COSMOLOGY_A0_DERIVATION/analysis/gate_holdout_replication.py"
      - "02_TESTS/COSMOLOGY_A0_DERIVATION/analysis/result_gate_holdout.json"
      - "02_TESTS/COSMOLOGY_A0_DERIVATION/analysis/null_discovery_adversary_notes.md"
    gate_holdout_result: >
      Terceiro agente independente, provenance re-auditada do zero
      (checksums batem: SPARC_Lelli2016c.mrt e discovery_holdout_split.json
      identicos aos documentados; 175/175 correspondencia catalogo<->rotmod
      confirmada), abriu o holdout selado (55 galaxias, 1062 pontos, 0
      excluidos) pela primeira vez e reexecutou EXATAMENTE a estatistica da
      Secao 4 do pre-registro (nenhuma mudanca de criterio). Codigo proprio
      validado reproduzindo a amostra de descoberta a 5 casas decimais
      antes de aplicar no holdout. g-dagger ajustado no holdout = 4,1518e-10
      m/s^2 -- MUITO diferente do valor de descoberta (1,1977e-10) e da
      literatura. IC bootstrap 95% = [8,02e-11, 9,07e-10] -- largo o
      suficiente para conter TANTO a0_A quanto a0_B
      (verdict_pattern_holdout: BOTH_SURVIVE_INCONCLUSIVE). Diagnostico
      informativo (nao parte do criterio): 3 de 55 galaxias
      (UGC06787, UGC11914, UGC02953) respondem por 91,7% da soma pooled de
      g_bar^2 no holdout -- concentracao de leverage muito maior que na
      amostra de descoberta (58,9% nas top-3 la), o que explica a
      discrepancia sem indicar erro de codigo ou dado. Gate verdict oficial:
      REPLICATION_FAILED_INCONCLUSIVE -- nao contradiz o resultado de
      descoberta (H_B nao passou a sobreviver), mas tambem nao o confirma
      de forma independente. O achado de descoberta (H_A sobrevive/H_B
      falsificada) deve ser tratado como SUGESTIVO, nao confirmado.
    result_summary: >
      g-dagger ajustado (120 galaxias de descoberta, dado real, holdout
      selado intocado) = 1,1977e-10 m/s^2 (0,2% do valor de McGaugh et
      al. 2016 -- checagem de sanidade passa). IC bootstrap 95% (1000
      replicas por galaxia) = [6,76e-11, 2,78e-10]. a0_A (Holographic
      Bridge, cH0/2pi ~= 1,08e-10) DENTRO do IC -- H_A sobrevive. a0_B
      (MOND Emergence, cH0 ~= 6,80e-10) FORA do IC por fator ~2,5x acima
      do limite superior -- H_B falsificada. Bug numerico real encontrado
      e corrigido durante a propria execucao (curve_fit sem reescala
      "convergia" silenciosamente para o proprio p0 em escala absoluta
      ~1e-10 -- verificado e corrigido antes de aceitar qualquer
      resultado).
    adversarial_verdict: CONFIRMED
    adversarial_verdict_detail: >
      Reexecucao independente (agente separado, codigo proprio, escrito
      ANTES de ler o script/resultado primario) reproduziu N de pontos
      (2327), N excluidos (2), e g-dagger (1,19762e-10 vs 1,19767e-10,
      0,004% de diferenca) -- e redescobriu, de forma independente, o
      mesmo bug de underflow numerico antes de corrigi-lo do mesmo jeito.
      Nenhum bug de implementacao encontrado (razoes massa-luz,
      quadratura com preservacao de sinal, conversao de unidades,
      bootstrap em nivel de galaxia -- todos conferidos linha a linha).
      Holdout confirmado intocado nos dois scripts (grep + leitura de
      codigo). Checagens de robustez: ajuste em espaco log (informativo,
      nao pre-registrado) da g-dagger=9,44e-11, mais baixo mas H_B
      continua falsificada por margem grande (~7x fora); excluir a
      galaxia de pior residuo (UGC02455) desloca o IC minimamente,
      veredito identico. Falsificacao de H_B e decisiva e robusta a
      escolhas de implementacao razoaveis -- nao e um resultado fragil
      como o piloto SPARC-001 (p=0,049).
    next_action: >
      Nenhuma pendente -- Gate de Replicacao concluido nos dois papeis
      (holdout aberto por terceiro agente independente:
      REPLICATION_FAILED_INCONCLUSIVE; adversario de nulo dedicado:
      achado sobrevive a debunking mas com peso evidencial recalibrado
      para baixo -- ver DISC-CLAIM-002 em CLAIM_LEDGER.yaml para o
      detalhamento completo). Nao ha promocao a 04_FORMAL_RESEARCH_LAB --
      este e um achado empirico sem nucleo matematico demonstravel
      (RESEARCH_PIPELINE.md), e mesmo se fosse, o Gate nao confirmou de
      forma decisiva. Achado acionavel independente do veredito
      estatistico: MOND_Emergence/index.html:282 provavelmente contem um
      erro de copy-paste (rotula o resultado numerico da derivacao A como
      se fosse da derivacao B) -- recomendado para correcao em
      01_TAMESIS_CORE, fora do escopo desta trilha. Reabrir esta pergunta
      especifica exigiria um holdout novo (este foi consumido) e novo
      pre-registro.
    pivot_note: >
      Desenho original (SPARC como comparacao preditiva "Tamesis vs.
      modelo concorrente nomeado") abandonado ANTES de qualquer
      pre-registro: investigacao do next_action original (busca dedicada
      em 01_TAMESIS_CORE) encontrou que nao existe previsao Tamesis
      numericamente distinta de MOND generico para dinamica galactica --
      ver DISC-DEC-004 para o achado completo e a citacao exata dos
      arquivos. Pivotado para um teste genuinamente Tamesis-especifico
      que o proprio achado negativo revelou: o corpo teorico Tamesis
      contem DUAS derivacoes internas conflitantes de a0 (fator ~2pi de
      diferenca, uma delas ainda aritmeticamente inconsistente com sua
      propria alegacao numerica), nunca testadas uma contra a outra.
      Pre-registro completo em
      02_TESTS/COSMOLOGY_A0_DERIVATION/PREREGISTRATION.md.
    description: >
      Testa qual das duas derivacoes internas de a0 documentadas em
      01_TAMESIS_CORE (a0=cH0/(2pi), "Ponte Holografica"; a0=cH0, "MOND
      Emergence") e compativel com g-dagger ajustado diretamente ao dado
      real SPARC (nao ao valor de literatura citado de memoria). Split
      discovery (120 galaxias)/holdout selado (55 galaxias) ja gerado e
      commitado antes de qualquer analise.
    next_action: >
      Rodar o ajuste nao-linear de g-dagger sobre a amostra de descoberta
      (120 galaxias) exatamente como travado na Secao 4 do
      PREREGISTRATION.md, calcular IC bootstrap de 95%, verificar se
      a0_A e/ou a0_B caem dentro. Depois: reexecucao adversarial
      independente (AGENTS.md passo 7).
    stop_condition: >
      reformular H_A/H_B, a formula de g_bar, o split discovery/holdout,
      ou o criterio de falsificacao depois de olhar o resultado do ajuste;
      abrir o holdout (55 galaxias) fora do Gate de Replicacao; alegar
      "Tamesis confirmado" a partir de qualquer resultado aqui -- o
      maximo que este teste decide e qual das duas derivacoes internas
      sobrevive, nao se Tamesis e verdadeiro.

  - test_id: DISC-RH-REAL-001
    title: "Linha RH real (riemannZeta) -- distinta de RH-TOY/Tp em 04_FORMAL_RESEARCH_LAB"
    domain: matematica_pura
    parent_legacy: null
    related_tests:
      - "04_FORMAL_RESEARCH_LAB 03_MILLENNIUM/01_RIEMANN (Tp, reclassificado por DEC-107 como teste unitario de maquinario, nao pesquisa sobre RH)"
    status: CANDIDATE_FORMULATING
    existing_assets:
      - "02_TESTS/RH_ZETA_ZEROS/data/PROVENANCE.md"
      - "02_TESTS/RH_ZETA_ZEROS/data/zeros1.txt (100k zeros reais, Odlyzko)"
      - "02_TESTS/RH_ZETA_ZEROS/data/zeros2.txt (100 zeros alta precisao)"
      - "02_TESTS/RH_ZETA_ZEROS/data/zeros3.txt (10k zeros perto de #10^12)"
      - "02_TESTS/RH_ZETA_ZEROS/PHASE0_TRIAGE_SUMMARY.md"
      - "02_TESTS/RH_ZETA_ZEROS/analysis/phase0_triage.py"
      - "02_TESTS/RH_ZETA_ZEROS/analysis/phase0_triage_result.json"
    description: >
      Motivada pelo caso Anthropic (bound de proporcao de zeros de zeta na
      linha critica, 41.6%->67.2%, artefato Lean publico sobre
      Mathlib.riemannZeta/analyticOrderAt sem sorry) -- evidencia de que
      exploracao em larga escala sobre o objeto matematico REAL, seguida
      de formalizacao forte, podem coexistir. Esta linha ataca
      `riemannZeta` real, nao um operador de brinquedo.
    phase0_progress: >
      Fase 0 iniciada 2026-08-12. Dado real localizado e baixado
      (tabelas de Odlyzko, verificadas por fetch direto -- ver
      data/PROVENANCE.md). Levantamento de literatura produziu 12
      conjecturas/resultados concretos e numericamente testaveis, cada
      um com citacao verificada (nao as 50-500 originalmente previstas --
      12 bem documentadas priorizadas sobre um numero maior e raso).
      Triagem numerica rodada para 6 dos 12 itens (os que so precisam de
      localizacao de zeros, nao avaliacao de zeta(s)) sobre 100k zeros
      reais -- ver PHASE0_TRIAGE_SUMMARY.md para a tabela completa de
      resultados. Achado operacional: pipeline valida contra estatisticas
      GUE/N(T) conhecidas (itens 1,2,3) -- ferramental funciona. Item 9
      (runs de gaps moderados consecutivos, questao aberta arXiv:2412.15481)
      e item 7 (constante de gaps pequenos, Inoue 2026, arXiv:2604.05733)
      sinalizados como os candidatos mais promissores a pre-registro real
      -- nenhum ainda desenhado como pergunta falsificavel adequada.
    next_action: >
      Escolher um candidato (provavelmente item 9 ou item 7 do
      PHASE0_TRIAGE_SUMMARY.md) e desenhar uma pergunta genuinamente
      falsificavel com criterio de decisao a priori antes de qualquer
      pre-registro formal -- "o minimo/maximo observado e X" nao e
      falsificavel por si so. Itens 5, 6, 10 do levantamento (exigem
      avaliacao de zeta(s), nao so localizacao de zeros) permanecem
      nao-triados.
    stop_condition: >
      pular a fase de filtragem numerica/literatura e ir direto para Lean;
      alegar progresso sobre RH em si a partir de qualquer resultado desta
      linha antes de sobreviver ao Gate de Replicacao; reusar qualquer
      construcao de Tp/RH-TOY como se fosse resultado sobre riemannZeta
      real; tratar qualquer achado de Fase 0 (exploratory_only) como se
      fosse resultado pre-registrado.

  - test_id: DISC-RH-ZERO-GAP-RUNS-001
    title: "Runs de gaps moderados consecutivos entre zeros reais de zeta -- correlacao sequencial vs. reordenacao aleatoria"
    domain: matematica_pura
    parent_legacy: null
    related_tests:
      - "DISC-RH-REAL-001 (linha guarda-chuva; este e o primeiro sub-teste pre-registrado)"
    status: REPLICATION_PASSED
    existing_assets:
      - "02_TESTS/RH_ZETA_ZEROS/PREREGISTRATION.md"
      - "02_TESTS/RH_ZETA_ZEROS/data/PROVENANCE.md"
      - "02_TESTS/RH_ZETA_ZEROS/data/zeros4.txt"
      - "02_TESTS/RH_ZETA_ZEROS/analysis/run_preregistered_analysis.py"
      - "02_TESTS/RH_ZETA_ZEROS/analysis/result_primary.json"
      - "02_TESTS/RH_ZETA_ZEROS/analysis/adversarial_reproduction.py"
      - "02_TESTS/RH_ZETA_ZEROS/analysis/result_adversarial.json"
      - "02_TESTS/RH_ZETA_ZEROS/analysis/gate_third_dataset_replication.py"
      - "02_TESTS/RH_ZETA_ZEROS/analysis/result_gate_third_dataset.json"
    description: >
      Pergunta proxy falsificavel motivada pela questao aberta arXiv:2412.15481
      (existem infinitos runs de r gaps consecutivos normalizados >= c?
      nao testavel com dado finito). Testa em vez disso: a sequencia real
      ordenada por altura de gaps normalizados mostra correlacao
      sequencial de curto alcance (mais runs "todos >= c" do que uma
      reordenacao aleatoria do mesmo multiconjunto de valores)? Motivado
      por correlacao de Pearson negativa (-0,357) entre gaps consecutivos
      ja observada na Fase 0 (exploratoria, nao e a estatistica de teste).
      Grade pre-declarada: c em {0,10;0,20;0,30} x r em {2;3}, teste de
      permutacao (10.000 replicas), Bonferroni sobre as 6 celulas.
    result_summary: >
      VEREDITO: INVERSE_SIGNAL -- a hipotese H previu MAIS runs de gaps
      grandes consecutivos no dado real vs. nulo permutado; o resultado
      real foi o OPOSTO. Em c=0,30 (r=2 e r=3), a contagem real de runs
      ficou significativamente ABAIXO da distribuicao nula (p~0,0001,
      muito abaixo do limiar de Bonferroni 0,00833) -- essencialmente
      NENHUMA das 10.000 permutacoes teve contagem tao baixa quanto o
      dado real ordenado. Em c=0,20 o efeito e sugestivo mas nao cruza o
      limiar corrigido (p~0,02). Em c=0,10 sem efeito detectavel. MESMO
      padrao replicado no dataset secundario (zeros3.txt, regime de
      altura ~10^12, completamente disjunto): significativo em c=0,30
      (p~0,001 e p~0,0001), nao significativo em c<=0,20 -- consistencia
      cruzada de altura fortalece a confianca de que o efeito e real, nao
      um artefato de uma amostra especifica. INTERPRETACAO CORRIGIDA: a
      correlacao negativa entre gaps vizinhos (-0,357, achado da Fase 0)
      na verdade SUPRIME runs de gaps grandes consecutivos (correlacao
      negativa promove alternancia, nao persistencia) -- o raciocinio
      direcional da Secao 1 do pre-registro estava ERRADO na direcao,
      mas o teste capturou corretamente um efeito real na direcao oposta,
      exatamente o cenario INVERSE_SIGNAL que o proprio pre-registro
      exigia reportar de forma proeminente, nao escondido.
    adversarial_verdict: CONFIRMED
    adversarial_verdict_detail: >
      Reexecucao independente (agente separado, codigo proprio escrito
      antes de ler o script primario, seed distinta) reproduziu as 12
      contagens de runs relatadas (6 celulas x 2 datasets) BIT A BIT --
      concordancia exata, nao aproximada. Nenhum bug encontrado (formula
      de gap normalizado, contagem de runs vetorizada vs. loop ingenuo,
      preservacao de multiconjunto na permutacao, parsing do cabecalho de
      zeros3.txt, aplicacao do limiar de Bonferroni -- todos conferidos
      de forma independente). Checagem de artefato de deriva/tendencia
      (a preocupacao mais seria: um efeito de tendencia lenta ao longo da
      faixa de altura poderia produzir o mesmo padrao estatistico por um
      mecanismo totalmente diferente, sem relacao com correlacao
      sequencial real): correlacao entre indice de posicao e gap
      normalizado = ~5x10^-5 em ambos os datasets -- indistinguivel de
      zero, artefato descartado. Padrao de crescimento do efeito com c
      (nao significativo em 0,10, sugestivo em 0,20, forte em 0,30)
      avaliado como assinatura estatistica coerente de poder de teste
      (fracao de gaps "pequenos" cresce de 0,1% para 2,1% entre c=0,10 e
      c=0,30, dando mais poder para distinguir ordem real de ordem
      aleatoria), nao evidencia de cherry-picking -- a grade completa de
      6 celulas foi travada antes de qualquer calculo.
    gate_replication_result: >
      Gate de Replicacao completo acionado a pedido do usuario. Sem
      holdout selado declarado neste pre-registro -- clausula de fallback
      de 03_REPLICATION_GATE/PROTOCOL.md Secao 3 aplicada: checagem de
      robustez contra uma terceira fonte de dado genuinamente nova
      (zeros4.txt, regime de altura ~10^21, ~9 ordens de magnitude acima
      do secundario e ~15 acima do primario, nunca baixado nem inspecionado
      nesta sessao antes desta etapa). Terceiro agente independente
      (nao participou da analise primaria nem da primeira reexecucao
      adversarial): (1) baixou e verificou proveniencia do zeros4.txt por
      conta propria (fetch direto, checksum, verificacao do valor do
      primeiro zero contra o proprio cabecalho do arquivo -- adicionado a
      data/PROVENANCE.md); (2) implementacao nova, escrita antes de ler
      qualquer script anterior -- pegou e corrigiu por conta propria um
      risco de cancelamento catastrofico de ponto flutuante ao formar
      gamma=base+offset com base de 21 digitos (gaps computados
      diretamente dos offsets brutos, nao por subtracao de gammas ja
      somados); (3) rodou a MESMA grade travada (c em {0,10;0,20;0,30} x
      r em {2;3}, 10.000 permutacoes, Bonferroni) sobre zeros4.txt --
      MESMO padrao replicado: c=0,30 r=2 p=0,00100, c=0,30 r=3 p=0,00120,
      ambos significativos na direcao inversa; c<=0,20 nao significativo.
      Correlacao posicao-vs-gap ~-2,5x10^-4 -- artefato de deriva
      descartado tambem neste dataset. (4) Adversario de nulo dedicado:
      descartou artefato de precisao/truncamento (apenas 38 de 99.999
      gaps do primario ficam a 0,001 do limiar c=0,30; erro de
      truncamento verdadeiro ~3x10^-9, e truncamento afeta identicamente
      real e permutado, cancelando da comparacao por construcao); buscou
      na literatura e nao encontrou publicacao previa com esta estatistica
      exata de runs via permutacao (mecanismo subjacente -- correlacao
      serial negativa GUE -- e classico, mas esta forma de teste nao);
      simulacao sintetica AR(1)/copula Gaussiana com a MESMA correlacao
      de lag-1 (-0,349 vs -0,357 real) mas SEM nenhum conteudo de zeta
      reproduziu o mesmo padrao -- confirma que o efeito e consequencia
      generica de correlacao serial negativa (nao um artefato numerico,
      nem circular, nem exclusivo de zeta) -- a alegacao substantiva
      sempre foi "gaps de zeta SAO correlacionados negativamente" (ja
      bem estabelecido), e este teste de runs e uma segunda assinatura
      estatistica independente disso, nao uma alegacao de que o proprio
      teste de runs seja unicamente revelador. VEREDITO DO GATE:
      REPLICATION_PASSED -- os quatro requisitos satisfeitos e o terceiro
      dataset confirma o padrao a ~15 ordens de magnitude de distancia do
      dataset primario.
    next_action: >
      Nenhuma pendente neste teste. REPLICATION_PASSED, mas
      promoted_to_formal_lab permanece false (RESEARCH_PIPELINE.md --
      confirmacao numerica de estrutura GUE ja conhecida na literatura,
      nao ha teorema novo a extrair). Escolher proxima linha/sub-teste
      (outro candidato de RH-REAL, ou DISC-TRI-RG-001).
    stop_condition: >
      reformular a grade de c/r, o modelo nulo, ou o criterio de
