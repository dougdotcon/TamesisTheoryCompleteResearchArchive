    description: >
      Nao tenta construir uma Theory of Everything diretamente. Tenta
      descobrir uma lei de interface: um mapa de coarse-graining
      R_lambda: X_micro -> X_macro e uma quantidade I(X) tal que, em
      dominios DIFERENTES (sistema quantico, rede, fluido, sistema
      caotico, grafo, modelo cosmologico), sem alterar a definicao de
      I(X) a cada dominio, uma variacao Delta I preveja uma transicao de
      regime. Se a mesma estrutura matematica prever transicoes em varios
      dominios sem seu formalismo mudar dominio a dominio, isso e uma
      regularidade cross-domain inesperada -- nao automaticamente uma ToE,
      mas muito mais interessante que mais lemas sobre um operador
      construido para ser tratavel.
    phase0_result: >
      2026-08-14: 5 candidatos de (R_lambda, I(X)) avaliados em paralelo
      por agentes independentes com instrucao de verificar dado real (nao
      so citar) -- ver 02_TESTS/TRI_RG/phase0/PHASE0_SURVEY.md para o
      relato completo. 3/5 viable=true com dado real baixado e verificado
      em >=2 dominios: (1) critical-slowing-down [rank 1] -- variancia/
      autocorrelacao lag-1 crescentes perto de bifurcacao (Scheffer 2009,
      Dakos 2008/2012, Lenton 2012), 3 dominios com TRANSICAO REAL dentro
      do mesmo sistema no tempo verificados (GISP2 Younger Dryas, PhysioNet
      SDDB onset de FV, NASDAQ crash pontocom), modelo concorrente nomeado
      real (B-tipping vs R/N-tipping, Ashwin 2012) -- mas Delta I ainda NAO
      foi calculado (so acesso ao dado verificado), falta regra unica de
      selecao de lambda cross-domain, falta protocolo de nulo substituto;
      (2) wavelet-multiresolution-scaling [rank 2] -- WTMM/expoente de
      Hurst generalizado, R_lambda mais rigoroso matematicamente (R_2λ=
      R_λ'∘R_λ por construcao), mas so 1 dominio robusto (sismologia,
      mainshock de Tohoku 2011, rotulo USGS/GCMT externo) -- fisiologia e
      trafego de rede tem rotulos fracos/de classe, nao de transicao;
      (3) dfa-multiscale-entropy [rank 3] -- execucao empirica mais solida
      (DFA implementado do zero, validado contra nulos teoricos, rodado
      sobre dado PhysioNet real decodificado E sobre gaps de zeta ja
      usados em DISC-RH-GAP-EXTREME-VALUE-SCALING-001), mas os 2 dominios
      usados sao comparacoes ESTATICAS de classe (saudavel vs ICC;
      continental vs oceanico), nao transicoes temporais -- mesmo defeito
      estrutural que corretamente derrubou o candidato (4) abaixo, so
      detectado na sintese cross-candidato, nao pelo proprio agente.
      2/5 corretamente marcados viable=false pelos proprios agentes: (4)
      box-covering-network-renorm -- R_lambda mais literal/rigoroso de
      todos, dado real de 4 redes (SNAP/CAIDA) verificado, mas toda
      "transicao" fractal<->nao-fractal na literatura vem de modelos
      SINTETICOS com parametro artificial, dado real so mostra
      classificacao estatica (e essa classificacao esta sob disputa ativa
      em 2025); (5) spacing-statistics-rmt-non-zeta -- dado real (niveis
      nucleares RIPL-3, autovalores de rede SNAP) e computacao real
      executados, mas falha em identificabilidade (previsao identica ao
      consenso BGS/RMT de 40 anos, sem discriminador Tamesis) e em RG/EFT
      (nenhum R_lambda genuino implementado).
    gap_closing_result: >
      2026-08-14: os 3 gaps de critical-slowing-down (rank 1 na Fase 0)
      foram fechados a pedido do usuario -- ver
      02_TESTS/TRI_RG/critical_slowing_down/METHODOLOGY_NOTE.md e
      RESULTS_SUMMARY.md. Regra de lambda cross-domain (fracoes fixas do
      comprimento do segmento, convencao Dakos et al. 2012) e protocolo
      de nulo substituto AR(1) (Dakos et al. 2008 PNAS) fixados e
      commitados ANTES de qualquer calculo real (commit b43fde0), pipeline
      unica (csd_common.py) validada contra dado sintetico primeiro, depois
      chamada sem modificacao por 3 agentes independentes nos 3 dominios ja
      verificados (GISP2, PhysioNet SDDB, NASDAQ). RESULTADO: NEGATIVO --
      das 12 combinacoes testadas (3 dominios x 2 variantes x 2 canais),
      so 1 cruzou p<0,05 (GISP2/robustez/AC1, p=0,032), estatisticamente
      consistente com ruido puro sob 12 comparacoes multiplas sem correcao
      (esperado ~0,6 falsos positivos ao acaso). Pior: em 2 dos 3 dominios
      (PhysioNet SDDB, NASDAQ primaria) o canal de AC1 mostrou tendencia
      FORTEMENTE NEGATIVA (tau=-0,82, tau=-0,95, tau=-0,37) -- direcao
      OPOSTA a prevista por CSD, nao apenas "sem sinal". critical-slowing-
      down, formulado com uma regra de lambda genuinamente cega ao
      dominio (exigencia central de DISC-TRI-RG-001), NAO produz um
      invariante cross-domain confiavel nestes 3 dominios/transicoes.
      Achado negativo honesto, catalogado com o mesmo peso que um
      resultado positivo -- nao invalida CSD como fenomeno geral na
      literatura (que usa janelas informadas por conhecimento especifico
      de cada sistema, nao uma regra cega), apenas mostra que esta
      instanciacao especifica cross-domain nao sobrevive. NENHUM
      PREREGISTRATION.md foi escrito -- o proprio passo de fechamento de
      gaps evitou travar um pre-registro fadado ao fracasso.
    next_action: >
      Decisao do usuario, dado que critical-slowing-down e wavelet-
      multiresolution-scaling nao sobreviveram: reformular dfa-
      multiscale-entropy (rank 3) em torno de uma transicao temporal
      genuina dentro do mesmo sujeito/sistema (em vez da comparacao de
      classe estatica usada na Fase 0); nova rodada de busca por
      candidatos ainda nao considerados; ou considerar DISC-TRI-RG-001
      suficientemente explorada por ora (3 candidatos formulados e
      testados com rigor -- 2 fecharam gaps completos e adversarialmente
      checados, resultado negativo em ambos -- e priorizar outra linha.
      01_TAMESIS_CORE/03_TRANSITION_ATLAS e infraestrutura reaproveitavel
      candidata para hospedar um resultado futuro depois de sobreviver
      ao Gate de Replicacao.
    gap_closing_result_2: >
      2026-08-14: gaps de wavelet-multiresolution-scaling (rank 2 na Fase
      0) fechados a pedido do usuario -- ver
      02_TESTS/TRI_RG/wavelet_multiresolution/{METHODOLOGY_NOTE.md,
      RESULTS_SUMMARY.md}. Metodo WTMM/wavelet-leader completo substituido
      honestamente por log-cumulantes de coeficientes wavelet (WCM --
      Castaing/Gagne/Hopfinger 1990, Delbeke/Abry 2000, Wendt/Abry/Jaffard
      2007), por tratabilidade computacional do protocolo de 200
      substitutos IAAFT; R_lambda continua a mesma projecao multi-
      resolucao wavelet. Regra de janela (ate 2h de dado disponivel de
      cada lado da transicao, ou todo o disponivel se menor; variante de
      robustez trunca ao menor dos dois lados) e protocolo IAAFT (bicaudal,
      sem previsao direcional a priori) fixados e commitados ANTES de
      qualquer calculo real (commit 6da7112), pipeline validada contra
      controle sintetico multifractal (ruido gaussiano modulado por
      cascata log-normal: real C2=-1,81 vs substitutos -0,37 a -0,84,
      p=0,000; nulo mono-vs-mono corretamente nao-significativo).
      RESULTADO: NEGATIVO nos 2 dominios. EEG (CHB-MIT, chb01_03):
      variante primaria com significancia nominal (p=0,040 ΔC2; p=0,015
      ΔC1) desaparece por completo quando o PRE e truncado ao mesmo
      tamanho do POST (p=0,290; p=0,900, ΔC1 ate inverte de sinal) --
      frageis, dependentes do desenho do teste. Sismologia (Tohoku
      2011, IU.ANMO/BHZ): achado inicial muito significativo
      (ΔC2=+0,356 p=0,005; ΔC1=+0,942 p=0,000) acionou checagem
      adversarial completa -- hipotese de saturacao/clipping do
      sismometro REJEITADA (pico usa so 31,3% da escala de 24 bits,
      sem assinatura de clipping, sem relatos documentados para
      ANMO/GSN em Tohoku 2011), MAS o achado nao sobrevive a
      truncamento genuino (N=16.384: ΔC2 dispara para 2,30 mas
      diagnosticado como artefato de estimador de amostra pequena;
      ΔC1 perde significancia, p=0,595) nem a aparar so 1% das
      amostras extremas do POST (ΔC2 inverte de sinal e perde toda
      significancia, p=0,990) -- consistente com a propria limitacao
      do IAAFT sob marginais de cauda pesada ja documentada na
      validacao sintetica desta metodologia (razao de desvio-padrao
      POST/PRE de ~585x, ainda mais extrema que os ~190x ja sinalizados
      como problematicos). Nenhuma variante em nenhum dos 2 dominios
      tem ΔC2 E ΔC1 simultaneamente significativos e estaveis.
      wavelet-multiresolution-scaling, como critical-slowing-down antes
      dele, NAO produz um invariante cross-domain confiavel nestes 2
      dominios/transicoes testados com protocolo genuinamente cego ao
      dominio. NENHUM PREREGISTRATION.md foi escrito.
    stop_condition: >
      redefinir I(X) ou R_lambda por dominio (isso deixa de ser uma
