      a PRIMEIRA candidatura bivariada/direcional de toda a linha (as
      14 anteriores eram todas univariadas). Metodologia fixada em
      METHODOLOGY_NOTE.md ANTES de qualquer calculo real: embedding de
      historia propria via Ragwitz-Kantz 2002 (criterio estruturalmente
