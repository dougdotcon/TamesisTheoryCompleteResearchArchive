[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tamesis-formal-lab"
version = "0.1.0"
description = "Artifact validation and counterexample scaffolding for Tamesis Formal Research Lab"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

