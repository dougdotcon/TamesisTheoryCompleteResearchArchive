schema: tamesis-discovery-lab-decision-ledger/1
decisions:
  - decision_id: DISC-DEC-001
    date: 2026-08-12
    decision: >
      Criar a trilha de descoberta computacional (05_DISCOVERY_LAB),
      paralela ao 04_FORMAL_RESEARCH_LAB, a pedido explicito do usuario.
      Escopo inicial: aberto/multi-dominio (nenhum dominio unico fixado
      ainda -- infraestrutura primeiro). Piloto autorizado: auditar e
      refazer o trabalho legado de cosmologia/MOND-EFE
      (01_TAMESIS_CORE/02_Experimental_Validation/{Cosmology,MOND_EFE})
      como primeiro teste real desta trilha.
    rationale: >
      Contexto: sessao pesquisou e verificou um resultado real da
      Anthropic (bound de proporcao de zeros de zeta na linha critica,
      41.6% -> 67.2%, anthropic.com/research/riemann-zeta) produzido por
      exploracao LLM em larga escala sem peer review formal, mas com
      revisao adversarial substituindo peer review. O usuario perguntou
      se fazia sentido adotar metodologia semelhante. Discussao levou a
      uma pergunta mais fundamental: o usuario quer atacar "problemas
      fundamentais" via descoberta computacional (algoritmo, simulacao,
      maquina, dados publicos), explicitamente sem exigir peer review
      academico (que ele corretamente identifica como requisito
      institucional de credibilizacao, nao pre-requisito logico de
      descoberta) -- mas com disciplina de revisao interna substituindo.

      Mapeamento do arquivo (agente Explore) revelou que exatamente este
      tipo de trabalho ja foi tentado neste laboratorio, na linha G
      (cosmologia observacional): os scripts
      02_Experimental_Validation/{Cosmology,MOND_EFE} tentam testar
      Tamesis contra dados publicos reais (SPARC, Gaia), mas contem dado
      fabricado/embutido disfarcado de download real (URL quebrada com
      typo, SSL desabilitado, fallback silencioso para catalogo
      hardcoded) e alegacoes estatisticas infladas ("EFE CONFIRMED,
      p<0.000001") que precisaram ser corrigidas depois por notas de
      auditoria (AUDITORIA.md, 2026-07-29) -- corrigidas DEPOIS do fato,
      nao impedidas antes. Isso e evidencia concreta, dentro do proprio
      arquivo, do risco que a ausencia de peer review cria quando nao
      substituida por outra disciplina.

      Tambem foi encontrada infraestrutura reaproveitavel real:
      01_TAMESIS_CORE/03_TRANSITION_ATLAS (registro schema-driven,
      Pydantic + JSON Schema, proveniencia rastreada, suite pytest,
      politica de promocao epistemica) -- nao reusada diretamente nesta
      decisao (usuario escolheu diretorio de topo separado), mas serve
      como precedente de disciplina dentro do proprio Tamesis Core.

      Usuario escolheu explicitamente: (a) trilha nova como diretorio de
      topo separado (05_DISCOVERY_LAB), nao dentro de 03_TRANSITION_ATLAS;
      (b) escopo aberto/multi-dominio, infraestrutura primeiro; (c)
      cosmologia/MOND-EFE como piloto, auditando e refazendo com dado
      real e disciplina de pre-registro, ja que o codigo e a hipotese ja
      existem -- so os dados e a disciplina estao quebrados.
    authority: user_explicit_authorization
    affected_paths:
      - "05_DISCOVERY_LAB/ (novo diretorio de topo)"
    reversibility: reversible
    wildcard: true
    governance_changes:
      - "novo diretorio de topo 05_DISCOVERY_LAB com sua propria governanca (AGENTS.md, DECISION_LEDGER.yaml, CLAIM_LEDGER.yaml, PREREGISTRATION_TEMPLATE.md)"
      - "04_FORMAL_RESEARCH_LAB permanece intocado e continua rodando em paralelo (ciclo de ondas Lean nao pausado)"
    untouched_safeguards:
      - "nenhuma alegacao de Problema do Millennium resolvido, aproximado, ou alcancavel por esta trilha"
      - "nenhuma alegacao de 'nova fisica confirmada' sem replicacao independente"
      - "dado embutido/fabricado proibido -- toda fonte precisa de URL real verificada por fetch direto"
      - "reexecucao adversarial obrigatoria antes de catalogar qualquer resultado"
      - "resultados negativos/nulos catalogados com o mesmo peso que positivos"
      - "trabalho legado de cosmologia/MOND-EFE e Millennium fora do Lean lab tratado como nao-citavel ate ser auditado individualmente"

  - decision_id: DISC-DEC-002
    date: 2026-08-12
    decision: >
      Fechar DISC-COSMOLOGY-MOND-SPARC-001 (o piloto autorizado por
      DISC-DEC-001) como INCONCLUSIVO/FRAGIL, nao como "EFE detectado" nem
      como "EFE falsificado". Registrado em DISC-CLAIM-001.
    rationale: >
      Pre-registro (PREREGISTRATION.md, commit 49867fa) travado antes de
      qualquer calculo sobre dado real, adaptando o desenho original
      Virgem-vs-campo (impossivel de reproduzir: nenhuma das galaxias de
      Virgem citadas pelo codigo legado esta no catalogo SPARC publico
      real, ver AUDIT_LEGACY_MOND_EFE_SPARC.md Achado 5) para
      aglomerado-de-Ursa-Maior-vs-campo usando um campo nativo do proprio
      catalogo (f_D=4). Analise pre-registrada rodada sobre
      SPARC_Lelli2016c.mrt + Rotmod_LTG/*.dat reais (175 galaxias, 0
      exclusoes) deu p=0.049373 (uma cauda, direcao EFE) -- cruza o limiar
      de 0.05 mas cai na zona fragil (0.04-0.06) que o proprio
      pre-registro (Secao 5) ja previa e exigia reportar como tal, nao
      como confirmacao limpa.

      Reexecucao adversarial (agente independente, codigo proprio escrito
      do zero, sem ler o script primario antes) reproduziu os numeros
      exatamente (nenhum bug encontrado) e adicionou uma checagem de
      robustez informativa (nao pre-registrada, declarada como tal):
      excluir 4 galaxias de campo cuja "inclinacao externa" e um ajuste de
      apenas 2 pontos (residuo zero, alavancagem maxima) faz p subir para
      0.0635, invertendo o veredito binario pela mesma formula. Veredito
      formal do agente adversarial: INCONCLUSIVE.

      Isto e o resultado que a trilha foi desenhada para produzir com
      honestidade: nem a manchete inflada do codigo legado ("EFE
      CONFIRMED, p<0.000001", ver AUDIT_LEGACY_MOND_EFE_SPARC.md), nem uma
      negação categorica -- um resultado real, correto, reproduzido de
      forma independente, e corretamente rotulado como fragil demais para
      sustentar qualquer alegacao de deteccao.
    authority: agent_protocol_compliance
    affected_paths:
      - "05_DISCOVERY_LAB/01_PORTFOLIO/TEST_QUEUE.yaml (status -> CLOSED_INCONCLUSIVE)"
      - "05_DISCOVERY_LAB/00_GOVERNANCE/CLAIM_LEDGER.yaml (DISC-CLAIM-001)"
    reversibility: reversible
    wildcard: false
    governance_changes: []
    untouched_safeguards:
      - "nenhuma linguagem 'CONFIRMED'/'DETECTED' usada para este resultado, em nenhum arquivo desta trilha"
      - "checagem de robustez pos-hoc reportada como informativa, explicitamente NAO recatalogada como novo teste pre-registrado"
