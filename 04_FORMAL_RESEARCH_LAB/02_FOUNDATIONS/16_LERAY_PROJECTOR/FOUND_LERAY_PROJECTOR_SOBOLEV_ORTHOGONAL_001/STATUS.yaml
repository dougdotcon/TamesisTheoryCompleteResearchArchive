scope_decision: >
  Proved via an explicit pullback pairing hsInner (f g := inner (toL2 f)
  (toL2 g)), NOT via a global InnerProductSpace (Hs E F s) instance.
  Mathlib's InnerProductSpace.induced requires the domain's norm to be
  definitionally the matching SeminormedAddCommGroup.induced instance for
  the SAME map; Hs's norm was installed via NormedAddCommGroup.induced
  with an AddMonoidHom (toL2AddHom), not verified compatible with what
  InnerProductSpace.induced expects. Installing the instance blind risked
  a silent type-class diamond. The pullback pairing proves the same
  mathematical content (self-adjointness as a symmetry identity,
  orthogonal-complement identity, Pythagoras) without that risk.
