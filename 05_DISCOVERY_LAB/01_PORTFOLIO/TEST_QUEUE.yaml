    kramers_moyal_gap_closing_result: >
      2026-08-19: usuario pediu para fechar o candidato ranqueado #2 na
      busca de Fase 0.6, kramers-moyal (reconstrucao de Fokker-Planck
      via coeficientes de Kramers-Moyal). Metodologia fixada em
      02_TESTS/TRI_RG/kramers_moyal/METHODOLOGY_NOTE.md ANTES de
      qualquer calculo real: teste de Markov-Einstein/Chapman-Kolmogorov
      para selecionar tau_ME (R_lambda orientado a dado), D1(x)/D2(x)
      via momentos condicionais binados, I(X)=PKS (curtose de forma do
      potencial reconstruido) primario + beta_D2 (dependencia de estado
      do ruido) companheiro -- com kappa=-D1'(x*) demovido a
      diagnostico-apenas DESDE O INICIO, com base em prova algebrica ja
      publicada (Ritchie & Sieber 2016) de identidade com a taxa de
      decaimento ja testada e refutada por critical_slowing_down.
      VALIDACAO SINTETICA confirmou poder real e limpo para PKS
      (controle positivo SDE biestavel, p=0,005; controle negativo
      p=0,23); beta_D2 nao mostrou poder detectavel em nenhuma variante
      nem sob o fallback de bootstrap pre-autorizado -- demovido tambem
      a diagnostico por decisao da sessao orquestradora (adendo,
      commit 9d35eeb), antes de qualquer dado real. RESULTADO REAL (2
      dominios x 2 variantes): PhysioNet vfdb (arritmia ventricular
      maligna, registro 418) -- propriedade de Markov NUNCA
      ESTABELECIDA (teste de CK rejeita fortemente em quase todos os
      lags curtos, esperado teoricamente para ECG bruto sem informacao
      de fase cardiaca) -- tau_ME nao encontrado, PKS nao computado, em
      ambas as variantes; EUR/CHF (choque do SNB, 15/01/2015) -- tau_ME
      estabelecido normalmente no PRE, mas PKS fica ESTRUTURALMENTE
      INDEFINIDO no POST (nao apenas nao-significativo): o choque
      (~15% num dia, confirmado empiricamente) e grande demais para os
      10 bins de quantil fixados do PRE resolverem o POST (~50% de todo
      o POST cai num unico bin), retornando insufficient_defined_bins
      -- consequencia honesta da propria regra de bins-fixos-do-PRE
      (travada precisamente para evitar reestimacao ad hoc) colidindo
      com um choque extremo. Reexecucao adversarial NAO acionada
      (nenhum achado positivo computavel a explicar). Fechado sem
      veredito de significancia computavel em nenhuma das 4
      combinacoes, por dois motivos estruturais distintos e honestos
      (nao um problema de poder de IAAFT). 9o candidato desta linha sem
      achado sobrevivente. Nota metodologica para tentativas futuras
      (nao decidida): bins definidos sobre a uniao PRE+POST, ou
      normalizacao por log-retorno, poderiam evitar a colisao de bins
      encontrada em choques extremos -- registrada, nao implementada.
      Detalhes completos: 02_TESTS/TRI_RG/kramers_moyal/
      {METHODOLOGY_NOTE.md,VALIDATION_NOTE.md,RESULTS_SUMMARY.md}.
    evt_hill_gap_closing_result: >
      2026-08-19: usuario pediu para fechar o ultimo candidato
      formalizado da Fase 0.6, evt-hill (dinamica do indice de cauda via
      estimador de Hill). Metodologia fixada em
      02_TESTS/TRI_RG/evt_hill/METHODOLOGY_NOTE.md ANTES de qualquer
      calculo real, com um desvio deliberado e justificado da convencao
      padrao desta linha: o protocolo de significancia NAO usa IAAFT
      (que preserva a marginal exata por construcao, tornando a nula
      degenerada para um estimador puramente baseado em estatisticas de
      ordem como Hill) -- usa em vez disso um teste de randomizacao do
      ponto de corte dentro da serie combinada PRE+POST. I(X)=xi_Hill
      (primario, selecao de k* via bootstrap simples de MSE, limiar
      REESTIMADO por segmento, nao fixado do PRE -- licao aprendida do
      colapso de bins em kramers-moyal/EUR-CHF) + xi_MLE (companheiro,
      GPD/MLE). VALIDACAO SINTETICA confirmou xi_Hill correto contra
      distribuicoes de cauda conhecida (Pareto, Student-t) e poder real
      do teste de randomizacao para PRE/POST desbalanceado (o caso
      realista); achado honesto: com PRE/POST de comprimento IGUAL a
      nula fica estruturalmente deslocada perto do Delta real (menor
      poder), fenomeno depois confirmado generalizar para dado real.
      Checagem obrigatoria de redundancia com SOC (reaproveitando dado
      ja commitado) ficou inconclusiva por poder estatistico (n=3),
      levemente contra redundancia simples. RESULTADO REAL: PDX (onda
      de calor 2021, NOAA GHCN-Daily) ESTRUTURALMENTE NAO TESTAVEL --
      piso de amostra MIN_N_PER_SEGMENT=200 nao atingido (POST=37 dias,
      consequencia inevitavel da resolucao de 1 obs/dia combinada com a
      janela de "semanas nao dias" exigida para evitar circularidade);
      Cape Fear (furacao Florence 2018, USGS 02105769) -- canal
      primario xi_Hill SEM significancia em nenhuma variante
      (p=0,185/0,22), canal companheiro xi_MLE significativo so na
      variante de robustez (p=0,025), investigado a fundo e explicado
      por um platô de crista de cheia fisico real e limitado (suporte
      GPD finito, nao cauda mais pesada) mais um modo de instabilidade
      de xi_MLE ja documentado na validacao ANTES de dado real.
      Checagem de confundidor de comporta (Lock 1, gatilho pre-
      declarado) acionada -- log operacional publico nao encontrado,
      mas evidencia circunstancial (estrutura submersa no pico,
      documentado fotograficamente) pesa contra o confundidor. Fechado
      NEGATIVO no canal primario nos 2 dominios (1 nao testavel por
      piso de amostra, 1 sem significancia) -- 10o e ultimo candidato
