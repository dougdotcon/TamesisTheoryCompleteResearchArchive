  - decision_id: DISC-DEC-044
    date: 2026-08-22
    decision: >
      Integrar o resultado do referee adversarial dedicado a phi_EPS
      (DISC-DEC-043, x0_asymmetry_attempt/adversarial/REFEREE_REPORT.md)
      -- VEREDITO CINDIDO. (A) eps=P(ciclico|x0 em R) != 0: SOUND,
      confirmado de forma MAIS forte que o proprio documento-alvo --
      referee mediu eps em 18 celulas (alvo: 6) com 3,0e4-6,8e5 eventos
      ciclicos por celula (alvo: 157-483 eventos), por um metodo que
      NAO simula nenhum passeio (grafo funcional completo, conjunto
      ciclico exato, eps=soma|ciclo intersecao R|/soma|R|), eliminando
      por construcao qualquer bug de contabilidade de passeio. eps
      nao-zero a 190-260 sigma por celula; concorda com a medicao do
      alvo em 5 de 6 celulas -- a sexta (b=400/c=100) e uma flutuacao
      de +3,4 sigma da propria amostra de 157 eventos do alvo, nao um
      erro do referee (confirmado por DOIS outros seeds independentes).
      Correcao de significancia: as barras de erro do estagio B do
      alvo estao sub-dispersas ~1,8x (o proprio item aberto SS6 do
      alvo ja apontava isso) -- a faixa honesta e ~8-14 sigma, nao
      12,5-21,7 sigma. O MECANISMO correto: a suposicao eps=0 dos
      predecessores descartava corretamente o interior sombreado de R
      mas descartava SILENCIOSAMENTE a subpopulacao run-start de R
      (fracao rho_start/rho ~ 1/b), que sao alvos de fechamento vivos
      comuns, nao pontos sombreados. (B) phi_EPS melhora phi_CAND: SOUND
      WITH NAMED ISSUES -- a melhoria de chi^2 e real, reprodutivel e
      fora-da-amostra (as 4 reducoes de chi^2 alegadas reproduzem a
      <0,1; repete em DUAS grades novas do referee a 4x a precisao do
      alvo; substituir o eps modelado pelo eps EXATAMENTE medido muda
      chi^2 em <1%) -- MAS a derivacao de SS5.2 do documento-alvo contem
      DOIS erros sistematicos removiveis, um por canal, presentes com o
      MESMO sinal em TODAS as 18 celulas da grade, em 11 celulas de uma
      sonda de canal independente, em b=1..400 e numa faixa de 4x em n:
      (i) canal run-start 2%-33% ALTO DEMAIS -- um passeio run-start
      carrega DOIS alvos vivos em t=0 (x0 e o alvo do primeiro sorteio
      f), nao um, dando phi_runstart=integral de P(1-t)^(2P-1)e^(-cH)dt
      < phi_cond (demonstrado livre-de-modelo a -48,7 sigma em b=1,c=10);
      (ii) canal sorteio-f 5%-43% BAIXO DEMAIS -- E[#sorteios]=
      (1+c*T)/(1-rho), nao c*T/(1-rho) -- falta a cadeia de abertura em
      x0 (confirmado celula a celula contra medicao EXATA de E[N] via
      identidade de Wald). A explicacao de "ruido de Poisson" de SS5.2
      para o espalhamento das razoes de canal esta ERRADA -- o desvio e
      sistematico, monotono em c, sinal oposto nos dois canais. Os dois
      erros tem sinais opostos e se cancelam em grande parte em phi,
      por isso a alegacao de chi^2 sobrevive intacta enquanto a
      derivacao nao. Nenhum sinal de ajuste pos-hoc encontrado
      (timestamps, PROGRESS.log, e o fato de a derivacao publicada
      SUBESTIMAR as proprias razoes medidas do documento-alvo --
      ninguem que ajusta aos proprios dados publica isso). TESTE
      DECISIVO: substituir o eps modelado pelo eps EXATAMENTE medido
      move chi^2 de 335,6 para 183,2 (grade do referee, 18 celulas) --
