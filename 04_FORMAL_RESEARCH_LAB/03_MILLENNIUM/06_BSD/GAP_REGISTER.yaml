gaps:
  - gap_id: BSD-GAP-001
    description: "Cobertura geral por posto e hipótese não estabelecida."
    status: OPEN
    detail: >
      Nenhuma fonte auditada em KNOWN_RESULTS_MATRIX.md cobre rank
      analítico >= 2 para curvas não-CM sem hipótese adicional de primo
      (ordinário-irredutível, supersingular ou Eisenstein). Permanece
      aberto em geral.
  - gap_id: BSD-GAP-002
    description: "Finitude global de Sha não segue automaticamente das fontes citadas."
    status: OPEN
    detail: >
      Finitude de Sha(E) está estabelecida apenas para rank 0/1
      (Kolyvagin, linha 2 da matriz) e para curvas CM (Rubin, linha 4).
      Fora desses casos permanece em aberto.
  - gap_id: BSD-GAP-003
    description: "Hipóteses (H1)-(H4) de Skinner-Urban citadas pelo documento legado não confirmadas contra fonte primária nesta sessão."
    status: OPEN
    detail: >
      O artigo Skinner-Urban, Invent. Math. 195 (2014), foi confirmado
      como existente e como provando a Iwasawa Main Conjecture ordinária
      para GL2, mas a lista exata de hipóteses (H1)-(H4) citada em
      ANALISE_CRITICA_BSD.md (legado) não foi recuperada de fonte
      primária nesta sessão de WebSearch/WebFetch. Marcado "aproximado"
      em ASSUMPTIONS.md e KNOWN_RESULTS_MATRIX.md.
  - gap_id: BSD-GAP-004
    description: "Listas exatas de primos p excluídos/exigidos por teorema não fixadas em detalhe nesta sessão."
    status: OPEN
    detail: >
      Para a maioria das linhas da matriz (Gross-Zagier, Kolyvagin,
      Skinner-Urban, BCS) só se confirmou a condição estrutural (p ímpar,
      boa redução ordinária, etc.), não a lista fechada de exclusões
      pontuais (p=2, p=3, primos anômalos) que tipicamente aparecem nos
      artigos primários. Requer leitura direta dos artigos, não feita
      nesta sessão.
  - gap_id: BSD-GAP-005
    description: "Nenhuma fonte afirma ou prova exaustividade das hipóteses conhecidas sobre o conjunto de todas as E/Q."
    status: OPEN
    detail: >
      Esta é a lacuna central que torna ilegítimo somar/unir as linhas da
      matriz em uma alegação de cobertura quase-total. Ver
      REVIEWS/AUDIT_REPORT.md e o stop_condition desta frente. Não é um
      gap técnico "a ser fechado por mais pesquisa bibliográfica" apenas
      — é estrutural: mesmo que se lesse todo artigo relevante publicado,
      a pergunta "toda curva satisfaz alguma H_i conhecida?" é, ela
      mesma, tão difícil quanto BSD em rank >= 2 geral.
  - gap_id: BSD-GAP-006
    description: "Combinação primo-a-primo das partes-p da fórmula BSD forte em uma igualdade integral, para uma curva fixa de posto 0/1, não verificada nesta sessão."
    status: OPEN
    detail: >
      Skinner-Urban/BCS cobrem p ordinário com representação irredutível;
      BSTW cobre p supersingular semiestável; CGS/CGLS cobrem p de
      Eisenstein. Essas três classes de primos parecem, informalmente,
      cobrir "a maioria" dos casos por curva, mas nenhuma fonte auditada
      aqui afirma explicitamente que união = todos os primos para uma
      curva arbitrária de posto 0/1, nem que os fatores p=2 e demais
      primos pequenos/de má redução aditiva estão tratados por alguma
      das linhas da matriz. Marcado OPEN por precaução epistêmica, não
      por contraexemplo conhecido.
  - gap_id: BSD-GAP-007
    description: "Nenhuma ponte Mathlib entre corpo de resíduo de completação ádica (Valued/UniformSpace.Completion) e corpo de resíduo de completação de módulo (AdicCompletion) -- necessária até para a multiplicatividade incondicional de WeierstrassCurve.LFunction."
    status: OPEN
    detail: >
      Descoberto por WAVE1-BSD-1 (item de infraestrutura formal, não
      literatura) em 2026-08-09. Categoria diferente dos gaps 001-006
      acima (esses são lacunas de cobertura na LITERATURA matemática;
      este é uma lacuna de INFRAESTRUTURA FORMAL no Mathlib). Três buscas
      independentes confirmam ausência: nenhum lema liga
      `v.adicCompletionIntegers K` (construção via `UniformSpace.Completion`
      de um corpo valorado) a `AdicCompletion (maximalIdeal R) R`
      (construção via limite inverso de módulo) -- são objetos
      genuinamente distintos sem ponte no Mathlib atual. Bloqueia a
      versão incondicional de `WeierstrassCurve.LFunction.IsMultiplicative`
      (a versão condicional, assumindo cardinalidade potência-de-primo do
      corpo de resíduo, já está provada). Ver
      03_MILLENNIUM/06_BSD/BSD-1_GAP_NOTE.md para o diagnóstico completo
      e o caminho de continuação sugerido.
  - gap_id: BSD-GAP-008
    description: "Cinco lacunas formais Mathlib separadas impedem invocar AddCommGroup.fg_of_descent' para obter Mordell-Weil fraco -- maior e mais espalhado do que o reconhecimento inicial supôs."
    status: OPEN
    detail: >
      Descoberto por WAVE1-BSD-4 (item de reconhecimento formal, não
      literatura) em 2026-08-09. Categoria diferente dos gaps 001-006
      acima (infraestrutura formal, não cobertura de literatura). Lista
      exata: (1) Mordell-Weil fraco (E(Q)/2E(Q) finito) totalmente ausente
      -- zero isogenia, zero mapa de Kummer, zero grupo de Selmer
      específico de curva elíptica em todo o Mathlib; (2) correção de
      `AddSubMap.lean:21` (TODO aberto, a fórmula da adição em
      coordenadas não está provada correta); (3) altura ingênua sobre
      E(K) não definida (TODO aberto em `Height/EllipticCurve.lean`);
      (4) lei do paralelogramo aproximada existe apenas como desigualdade
      de coordenadas em `Fin 3 → K` genérico, não como enunciado sobre
      pontos reais de E(K); (5) propriedade Northcott existe para
      `mulHeight₁` em P¹(K) mas não para qualquer altura em E(K) (depende
      de (3) primeiro). Ver 03_MILLENNIUM/06_BSD/BSD-4_GAP_NOTE.md para o
      diagnóstico completo, incluindo a tabela peça-por-peça e o caminho
      de continuação sugerido caso o laboratório abra uma frente dedicada
      de Mordell-Weil no futuro (projeto de escala própria, não uma
      continuação direta desta nota).
