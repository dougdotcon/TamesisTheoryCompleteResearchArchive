      revertida implicitamente pela nova instrucao explicita). Agente de
      busca dedicado investigou dominio fisiologico com transicao temporal
      genuina (nao mais comparacao estatica de classe) para
      dfa-multiscale-entropy. Encontrado: PhysioNet Apnea-ECG Database,
