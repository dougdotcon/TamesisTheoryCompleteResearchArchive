  - work_item_id: ENG-FINITE-STATE-RUNTIME-001
    title: "Certified Runtime Adapter for Finite Deterministic Systems"
    track: engineering_foundation
    target_statement: >
      Existe um adaptador executavel, definido em Lean e provado correto,
      que recebe uma tabela de transicoes dinamica, valida que todo
      destino permanece dentro do dominio, constroi uma funcao total
      Fin n -> Fin n correspondente a tabela e aplica o detector de
      ciclos ja verificado, devolvendo um certificado interpretavel na
      tabela original.
    expected_product: >
      Representacao bruta, predicado de fechamento, validacao executavel
      com erros tipados, estrutura validada, funcao de transicao tipada,
      teoremas de correspondencia entre step e lookup e entre iteradas e
      execucao da tabela, aplicacao do detector e testes concretos.
    dependencies:
      - LAB-BENCH-001
      - FOUND-SEMIGROUP-001
      - FOUND-SEMIGROUP-002
      - FOUND-FUNCTIONAL-GRAPH-001
      - FOUND-CYCLE-DETECTION-001
    existing_assets:
      - "05_FORMAL/lean/TamesisLab/Foundations/CycleDetection/"
      - "02_FOUNDATIONS/05_CYCLE_DETECTION/FOUND_CYCLE_DETECTION_001/PUBLIC_API.md"
    formalization_cost: moderate
    bibliographic_cost: low
    counterexample_access: high
    dependency_depth: 5
    external_dependency: none
    cross_track_value: high
    stop_condition: >
      corrigir destinos invalidos por modulo, clamp ou fallback silencioso;
      permitir que a tabela validada aponte para fora do dominio; usar
      escolha classica para produzir dados; depender de periodicOrbit;
