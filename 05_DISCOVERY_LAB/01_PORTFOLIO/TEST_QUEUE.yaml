    lempel_ziv_gap_closing_result: >
      2026-08-20: usuario pediu para fechar o primeiro candidato da Fase
      0.7, complexidade de Lempel-Ziv (LZC, LZ76/Kaspar & Schuster 1987,
      binarizacao por mediana/LZC_median primario + quantizacao ternaria/
      LZC_ternary companheiro). Metodologia fixada em METHODOLOGY_NOTE.md
      ANTES de qualquer calculo real. VALIDACAO SINTETICA: LZC_median
      (primario) NAO estabeleceu poder discriminativo por NENHUM dos 2
      testes disponiveis (IAAFT p=0,455, fallback de bootstrap p=0,95 --
      PIOR que IAAFT, nao melhor -- NO_POWER_ESTABLISHED_EITHER_TEST);
      LZC_ternary (companheiro) teve poder IAAFT real desde o inicio
      (p=0,0, sigma=-41,14). Bug de desempenho O(n^2) descoberto e
      corrigido no meio do caminho (reimplementacao O(n log n) via array
      de sufixos + LCP de Kasai, verificada bit-a-bit contra a versao
      ingenua em 800+ casos -- correcao estritamente de desempenho, nao
      de R_lambda/I(X)). REAL: Daphnet Freezing-of-Gait (S01R01,
      Parkinson) e Kilauea 2018 LERZ (HV.HAT..HHZ). Kilauea: NENHUMA
      combinacao significativa (p=1,0/0,805/0,09). Daphnet primaria: NAO
      significativa (p=1,0). Daphnet robustez: SIGNIFICATIVA nos 2 canais
      (p=0,0), sobreviveu a 3 checagens de confundidor da propria sessao
      (composicao de rotulo, glitch de sensor, deriva generica) --
      acionou reexecucao adversarial independente (passo 7 de
      AGENTS.md). REEXECUCAO ADVERSARIAL (segundo agente, sem memoria da
      sessao original): confirmou reproducao bit-a-bit e robustez ao
      deslocamento do ponto de corte (+-120s), MAS o achado NAO
      sobreviveu a 2 rotas novas -- (1) generalizacao entre sujeitos: de
      4 sujeitos testados sob o MESMO pipeline travado, so S01R01 atinge
