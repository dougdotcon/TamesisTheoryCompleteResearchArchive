      completo de Chae (2023): desprojecao 3D via Monte Carlo orbital
      (excentricidades individuais de Hwang, Ting & Zakamska 2022,
      MNRAS 512:3383, 74,3% da amostra; fallback populacional para o
      resto), mesmos H_A/H_B, catalogo, cortes de qualidade e split
      discovery(30.203)/holdout(12.944 selado, nao tocado) de
      SPARC-002/003. Estatistica discriminadora corrigida ANTES de
      qualquer dado real (Adendo 4c, apos validacao sintetica pre-lock
      revelar o efeito Kepleriano conhecido de v^2/r subestimar g_N sob
      excentricidade -- Eq. 16 de Chae): delta_obs-newt(bin) = mediana_real
      (log g/g_N) - mediana_mock(log g/g_N), mock Newtoniano casado por
      sistema. Analise primaria v1 (result_primary.json) produziu
      delta_obs-newt=[+0,2274;+0,1723;+0,1313;+0,1027;+0,0467],
      a0_fit=3,634e-10 (IC95% [2,944e-10;4,494e-10]), BOTH_FALSIFIED
      bruto. Descoberta adversarial de nulos obrigatoria (AGENTS.md passo
      7) achou um BUG DE IMPLEMENTACAO real (nao reformulacao): o ramo
      mock era gerado sem ruido astrometrico, enquanto o ramo real carrega
      ruido Gaia genuino (vies de Rice/Rayleigh) -- prova decisiva via
      teste sintetico (injetar o mesmo ruido simetricamente nos dois ramos
      colapsa o efeito para zero nos 5 bins). Corrigido (Secao 5b),
      revalidado sob os mesmos controles negativo/positivo do Adendo 4c,
      analise real re-executada: v2 (result_primary_v2.json) produz
      delta_obs-newt=[+0,1486;+0,1482;+0,1150;+0,0949;+0,0430] (~5x menor
      que v1), a0_fit=1,657e-10 (IC95% [1,232e-10;2,181e-10]) -- a0_A
      (1,082288e-10) cai logo ABAIXO do limite inferior do IC (margem
      ~0,057 dex), a0_B claramente fora. Reexecucao adversarial
      independente reproduziu v2 bit a bit. Gatilho pre-declarado de
      multiplicidade oculta (g/g_N real bruto>1 no bin 0) ativou a
      checagem adversarial obrigatoria (Secao 4/6): com o sinal v2
