  - decision_id: DISC-DEC-054
    date: 2026-08-23
    decision: >
      Autorizar onda 13, continuando o modo padrao de operacao
      multi-linha (DISC-DEC-023), com a onda 12 (DISC-DEC-051/052/053)
      agora inteiramente fechada em ambas as frentes -- 2 frentes
      matematicas puras independentes, cada uma uma reabertura
      explicitamente nomeada como legitima e ainda aberta pela propria
      integracao que a descobriu. (a) `U-PRIME-HYPOTHESIS-ATTEMPT` --
      tentar provar, ou caracterizar rigorosamente a obstrucao para, a
      hipotese (U'): |phi_n^(K)-phi_K| <= a*sqrt(K)/n uniformemente em
      0<=K<=n, com constante nitida a* = sqrt(pi)*(1/sqrt2-1/2) =
      0.3670872119... A onda 11 frente (a) (`uniform_in_c_attempt`,
      DISC-DEC-049) caracteriza (U') como "NUMERICALLY CHARACTERIZED,
      not proved" e nomeia precisamente os dois fatos que faltam: (i)
      que o maximo sobre n e sempre atingido em n=K+1 (confirmado
      numericamente ate K=16384, nunca provado), e (ii) que a razao
      convergente no extremo n=K+1 de fato tem a* como seu supremo
      sobre K (nao apenas seu limite). A onda 13 frente (a) (onda 12
      frente a, `mk_geometricity_attempt`, DISC-DEC-052) ja identificou
      explicitamente que provar o crescimento geometrico qualitativo de
      M_K -- que ela fechou -- e uma condicao estritamente MAIS FRACA
      que (U') (M_K pode crescer com K; (U') exige um limitante que NAO
      cresce com K), entao (U') permanece genuinamente aberta e nao
      reduzida por aquele resultado. Sucesso: uma prova de (U') com
      constante explicita, OU uma prova de que a* nao e atingivel como
      supremo uniforme (refutacao), OU uma caracterizacao rigorosa
      parcial (ex.: um limitante uniforme mais fraco que sqrt(K), com
      constante propria). Nao-fechamento honesto e um resultado
      aceitavel e catalogavel, como em toda frente anterior desta
      linha. (b) `LONG-CYCLE-DEFICIT-ATTEMPT` -- investigar o item 1,
      secao 9, aberto nomeado por
      `short_cycle_dynamics_attempt/ATTEMPT.md` (DISC-DEC-053): por que
      a populacao de ciclos longos (L>b) do M-CLUST(b) se estabiliza
      num deficit persistente de ~-10% a -15% relativo a phi_U(c''),
      nao encolhendo conforme L->n -- um efeito maior que qualquer
      outro que esta linhagem ja isolou para esta quantidade, e nao
      explicado pelo mecanismo de absorcao de ciclo curto que a frente
      anterior investigou. A propria frente anterior nomeia
      explicitamente a questao em aberto que esta frente deve tentar
      distinguir: se e um vies especifico da estrutura de blocos
      correlacionados do M-CLUST(b) na construcao de campo-medio
      (Poissonizacao/independencia, `DERIVATIONS.md` SS6 item 1), ou um
      artefato generico de n finito nao especifico ao M-CLUST(b).
      Sucesso: identificacao mecanistica clara com evidencia
      discriminativa entre as duas hipoteses (nao precisa fechar o
      residuo). Nao-fechamento honesto e aceitavel.
    rationale: >
      Ambas as frentes sao reaberturas explicitamente nomeadas e ainda
      abertas pelas proprias integracoes que as descobriram, com
      escopo, criterio de sucesso e criterio de nao-fechamento honesto
      ja embutidos no desenho -- nenhuma busca forcada. (a) e a ultima
      obstrucao nomeada entre Teorema A/C (ja provados,
      incondicionais, soft) e uma taxa de convergencia explicita nesta
      linha; (b) e o efeito de maior magnitude ja isolado no residuo
      M-CLUST(b) desde a onda 7, ainda sem candidata de correcao ou
      mecanismo proposto. Matematica combinatoria/assintotica pura,
      nenhum dado externo, nenhum holdout. Sessoes de calculo devem
      seguir a disciplina padrao: pre-registro antes de qualquer
      computacao real, aritmetica exata (`Fraction`/`Rational`) para
      qualquer alegacao PROVED, sementes RNG novas e verificadas via
      grep antes do uso (frente a: reservado 20260829000+, referee
      20260830000+; frente b: reservado 20260827000+, referee
      20260828000+), verificacao adversarial hostil obrigatoria para
      qualquer achado positivo -- incluindo achados positivos internos
      a um veredito geral de nao-fechamento honesto, como estabelecido
      em todas as ondas anteriores desta sessao.
