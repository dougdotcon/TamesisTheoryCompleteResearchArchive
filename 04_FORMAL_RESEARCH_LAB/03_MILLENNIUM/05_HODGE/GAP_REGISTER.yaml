gaps:
  - gap_id: HODGE-GAP-001
    description: "Existência geral de ciclos algébricos não provada."
    status: OPEN
    note: >
      Confirmado nesta sessão: nenhuma fonte primária consultada
      (Deligne/Clay, Charles 2010, Cattani-Deligne-Kaplan via citação)
      fornece um resultado análogo a Lefschetz (1,1) para codimensão
      p >= 2. Ver KNOWN_RESULTS_MATRIX.md e
      RESULTS/WORKED_CASE_NOETHER_LEFSCHETZ.md.
    evidence_level: V

  - gap_id: HODGE-GAP-002
    description: "Transversalidade não fornece sobrejetividade."
    status: OPEN
    note: >
      Confirmado e auditado passo a passo nesta sessão. O Teorema de
      CDK (algebricidade do locus de Hodge) é logicamente independente
      de qualquer afirmação de sobrejetividade do mapa de ciclos sobre
      classes de Hodge. No único caso auditado onde a conclusão de
      "sobrejetividade" é verdadeira (codimensão 1), ela decorre de um
      teorema distinto (Lefschetz (1,1)), não de CDK/transversalidade.
      Este é o stop_condition desta frente — ver ASSUMPTIONS.md e
      RESULTS/WORKED_CASE_NOETHER_LEFSCHETZ.md, Passo 4-5.
    evidence_level: V

  - gap_id: HODGE-GAP-003
    description: >
      CDK não determina o corpo de definição das componentes
      algébricas do locus de Hodge (aspecto aritmético, distinto de
      algebricidade sobre C).
    status: OPEN
    note: >
      Citação direta localizada nesta sessão: Charles (2010), logo
      após o enunciado do Teorema 2.8: "We don't get information on
      the field of definition." Eco em Deligne (Clay PDF), que marca
      "(unknown)" ao lado da versão sobre Q-barra da algebricidade do
      locus. Um refinamento posterior e distinto (Bakker-Klingler-
      Tsimerman, geometria tame/o-minimal) foi localizado na busca
      desta sessão mas não lido em profundidade -- não deve ser
      atribuído a CDK 1995. Ver DEFINITIONS.md.
    evidence_level: V

  - gap_id: HODGE-GAP-004
    description: >
      Documento legado (ANALISE_CRITICA_HODGE.md) usa linguagem de
      "percentual de resolução" (~85-90%) sem base metodológica
      auditável, e atribui a Griffiths (1968) uma caracterização
      ("classes fantasma instáveis sob deformação") não confirmada
      contra a fonte primária de transversalidade de Griffiths
      localizada nesta sessão (condição infinitesimal sobre a
      filtração de Hodge).
    status: FLAGGED_FOR_CORRECTION
    note: >
      Não é um gap matemático -- é um gap de precisão no documento de
      referência legado. Não corrigido no próprio arquivo legado (é
      somente leitura); a correção fica registrada aqui e em
      ASSUMPTIONS.md/REVIEWS/AUDIT_REPORT.md.
    evidence_level: V
