  - work_item_id: FOUND-SEMIGROUP-002
    title: "Dinamica discreta de monoides de transicao finitos"
    track: foundations
    target_statement: >
      Para o monoide finito de transicoes ja formalizado em
      FOUND-SEMIGROUP-001, caracterizar idempotentes, orbitas eventualmente
      periodicas e o pre-periodo, e exibir contraexemplos explicitos as
      generalizacoes ingenuas (nao comutatividade; orbita nao
      eventualmente constante).
    expected_product: >
      Definicoes pequenas, teoremas decidiveis e contraexemplos verificados
      por computacao em Lean.
    dependencies:
      - LAB-BENCH-001
      - FOUND-SEMIGROUP-001
    existing_assets:
      - "05_FORMAL/lean/TamesisLab/Foundations/"
      - "05_FORMAL/lean/TamesisLab/Tests/FoundSemigroup001.lean"
    formalization_cost: low
    bibliographic_cost: low
    counterexample_access: high
    dependency_depth: 2
    external_dependency: none
    cross_track_value: medium
    stop_condition: >
      confundir o exemplo finito com teoria geral; alegar resultado sobre
      semigrupos infinitos; reutilizar o modelo finito como suporte de
      alegacao fisica ou espectral
    priority_class: P1
    status: VERIFIED
    authorized_next_gate: FOUND_SEMIGROUP_002_RESULT_REVIEW_AUTHORIZED
    formalization_status: VERIFIED
    lean_root: "05_FORMAL/lean/TamesisLab/Foundations/FiniteDynamics/"
    result_boundary: "02_FOUNDATIONS/03_SEMIGROUPS/FOUND_SEMIGROUP_002/RESULT_BOUNDARY.md"
    c3_boundary: "02_FOUNDATIONS/03_SEMIGROUPS/FOUND_SEMIGROUP_002/C3_BOUNDARY.md"
    specification_status: SPECIFICATION_READY
    specification_root: "02_FOUNDATIONS/03_SEMIGROUPS/FOUND_SEMIGROUP_002/"
    main_target_choice: C_CORE_BOUNDS_AND_PROPAGATION
    theorems_formalized: 41
    counterexamples_planned: 5
    mathematical_novelty: NONE
    novelty_boundary: "02_FOUNDATIONS/03_SEMIGROUPS/FOUND_SEMIGROUP_002/NOVELTY_BOUNDARY.md"
    selection_rationale: >
      Selecionado no gate RH_NOGO_RESEARCH_REVIEW. Nenhum dos seis itens
      remanescentes da fila satisfazia os criterios positivos daquele gate
      (todos caem em "evitar": Clay, PDE avancada, geometria espectral,
      TOE). Este item usa infraestrutura Mathlib ja disponivel e ja
      exercitada (Fintype, Decidable, decide), tem acesso ALTO a
      contraexemplos por ser finito e decidivel, e reutiliza diretamente
      material VERIFIED.
