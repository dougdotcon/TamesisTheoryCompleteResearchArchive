      Testa em vez disso, via teoria de valores extremos: o gap minimo
      entre N zeros reais escala como N^(-1/3) (repulsao de nivel GUE,
      densidade ~s^2 perto de s=0) ou N^(-1) (Poisson, sem correlacao)?
