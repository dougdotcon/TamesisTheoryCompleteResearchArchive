scope_decision: >
  IsSelfAdjoint/ContinuousLinearMap.adjoint NAO foram provados para heatOpL2. A
  primeira tentativa falhou por incompatibilidade entre o Module instance usado ao
  definir fourierMulL2/mulL2 (Lp.instModule, em FourierMultiplierL2.lean, que nao
  importa Mathlib.Analysis.InnerProductSpace.Adjoint) e o Module instance que
  ContinuousLinearMap.adjoint/eq_adjoint_iff exigem
  (InnerProductSpace.toNormedSpace.toModule) -- quase certamente defeq, mas a
  unificacao de metavariaveis que eq_adjoint_iff precisa nao resolve isso
  automaticamente. Em vez de forcar, a identidade bruta de produto interno
  (inner_heatOpL2_symm) foi mantida como o conteudo matematico entregue, sem o
  invólucro IsSelfAdjoint/adjoint -- mesma categoria de restricao prudente que a
  decisao de escopo de LP-GAP-005 (pareamento pullback em vez de instancia global).
