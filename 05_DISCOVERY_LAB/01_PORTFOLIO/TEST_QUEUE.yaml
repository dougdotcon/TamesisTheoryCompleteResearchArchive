      truncamento verdadeiro ~3x10^-9, e truncamento afeta identicamente
      real e permutado, cancelando da comparacao por construcao); buscou
      na literatura e nao encontrou publicacao previa com esta estatistica
      exata de runs via permutacao (mecanismo subjacente -- correlacao
      serial negativa GUE -- e classico, mas esta forma de teste nao);
