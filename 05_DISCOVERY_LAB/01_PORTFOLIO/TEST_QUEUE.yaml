      generalization_u_alpha: >
        Pergunta "por que alpha=1/2" RESPONDIDA por derivacao (rota
        PGFL generalizada, confirmada por reproducao adversarial
        independente em 3 rotas analiticas + numerica com sementes
        proprias): phi_q(c)=int_0^1 e^(-c*H_q(t))dt, H_q(t)=t-(1-t)*
        int_0^t (1-q(s))/(1-s)ds; para q(s)~a*s^beta,
        alpha=1/(1+min(beta,1)), e alpha em [1/2,1] para TODA a classe
        -- alpha<1/2 e IMPOSSIVEL (crowding quadratico dos inicios de
        arco). 1/2 e duplamente protegido (intercambiabilidade forca
        beta=1 E o crowding trava em 1/2 mesmo sem morte). alpha=1 e
        natural e povoada (auto-laco, antecessor, mistura com atomo).
        Nenhum mecanismo intrinseco natural com alpha em (1/2,1)
        encontrado (aberto). Achado adversarial GENUINO (nao refuta a
        classificacao, mas expoe lacuna real de rigor): a correcao
        finito-n publicada para M-CLUST(b) e insuficiente para b
        grande (b=50: desvio cresce ate -27,1%) -- classificado
