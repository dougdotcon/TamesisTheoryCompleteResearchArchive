    operationalization_result: >
      2026-08-22 (DISC-DEC-025): etapa de operacionalizacao concluida --
      02_TESTS/COGNITIVE_EEG_SPECTRAL/OPERATIONALIZATION.md. (1) I(X)
      operacionalizado como entropia espectral de Shannon normalizada do
      PSD estimado por Welch (Inouye et al. 1991; normalizacao de Vakkuri
      et al. 2004), media entre canais -- preferida a Lempel-Ziv literal
      (citada no paper original) por nao exigir um parametro de
      binarizacao adicional nao-mandatado; uma contradicao interna
      genuina no texto-fonte (a descricao "1/f^alpha, alpha aumenta" do
      regime "achatamento") foi identificada e resolvida, com um
      expoente aperiodico (FOOOF/specparam, Donoghue et al. 2020)
      definido como estatistica secundaria/exploratoria para o terceiro
      regime ("viscoso" -- sem dataset real identificado, nao testado).
      (2) R_lambda/pre-processamento fixados por dataset, verificados
      empiricamente (nao supostos) via parsing real de headers EDF
      baixados: Mumtaz = referencia orelhas-ligadas, 256Hz, 19 canais;
      DASPS = referencia mastoide, 128Hz, 14 canais, filtrado em
      hardware a 4-45Hz (limitacao explicita: R_lambda de DASPS nao
      alcanca a banda delta). Construcao de grafo/conectoma
      deliberadamente NAO exigida para a estatistica primaria (evita
      escolha arbitraria de estimador de conectividade); variante
      WPLI+Laplaciano especificada so como checagem de robustez futura
      opcional. (3) Modelos concorrentes nomeados: Sun et al. 2019 (MDD
      mostra clustering REDUZIDO/topologia randomizada, direcao OPOSTA a
      alegacao do paper legado de "atrator rigido"); Qi et al. 2023 (TAG
      mostra padrao de conectividade misto por banda, nao o "clustering
      alto uniforme" alegado); mais um nulo amplitude-apenas. (4) Regra
      de decisao a priori fixada: 2 testes independentes (Mumtaz: t de
      Welch MDD vs. HC; DASPS: t pareado ansioso vs. calmo), direcoes
      previstas exatas, confirma/refuta/inconclusivo definidos
      numericamente, correcao de Bonferroni recomendada. (5) Poder
      estatistico a priori (statsmodels, t nao-central): Mumtaz
      (N=34/30) precisa d>=0,71 para 80% de poder; DASPS (N=23 pareado)
      precisa d>=0,61 -- ambos SUBDIMENSIONADOS para a faixa de efeito
