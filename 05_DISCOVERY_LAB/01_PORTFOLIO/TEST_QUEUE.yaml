      (normalizacao de matriz GUE 2x; convencao de fronteira no
      estimador). Datasets primarios zeros1.txt (T~75k) e zeros3.txt
      (T~2,7e11); zeros4.txt (T~1,4e20, maior altura disponivel) selado
