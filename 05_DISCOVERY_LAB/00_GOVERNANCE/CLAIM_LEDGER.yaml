schema: tamesis-discovery-lab-claim-ledger/1
claims:
  - claim_id: DISC-CLAIM-001
    short_name: efe-sparc-uma-vs-field-outer-slope-inconclusive
    test_id: DISC-COSMOLOGY-MOND-SPARC-001
    exact_statement: >
      Em dado real SPARC (175 galaxias, Lelli/McGaugh/Schombert 2016),
      comparando a inclinacao externa log-log da curva de rotacao entre
      galaxias do aglomerado de Ursa Maior (f_D=4, N=28, media slope
      +0.0781 +/- 0.1937) e galaxias de campo (f_D!=4, N=147, media slope
      +0.1491 +/- 0.2544), um teste t de Welch de uma cauda na direcao
      prevista pelo EFE deu p=0.049373 -- cruza o limiar pre-registrado de
      0.05 mas cai na zona fragil (0.04-0.06) declarada a priori no
      pre-registro. O resultado nao e robusto: excluir 4 galaxias de campo
      cuja inclinacao externa foi ajustada com apenas 2 pontos (checagem
      de robustez informativa, nao um novo teste) inverte o veredito
      binario para "nao suporta EFE" (p=0.0635).
    evidence_level: preregistered_inconclusive
    preregistration_path: "02_TESTS/COSMOLOGY_MOND_SPARC/PREREGISTRATION.md"
    preregistration_lock_commit: "49867fa"
    data_provenance_path: "02_TESTS/COSMOLOGY_MOND_SPARC/data/PROVENANCE.md"
    adversarial_review_verdict: INCONCLUSIVE
    replication_status: NOT_SUBMITTED
    replication_gate_report_path: null
    promoted_to_formal_lab: false
    dependencies: []
    known_gaps:
      - "amostra de aglomerado pequena e desbalanceada (N=28 vs N=147)"
      - "aglomerado de Ursa Maior tem campo externo esperado muito mais fraco que o Virgem usado na predicao quantitativa original (g_ext/a0~1.25); este teste avalia apenas direcao, nao magnitude"
      - "estatistica outer-slope sensivel a galaxias com poucos pontos observados (leverage de ajustes de 2 pontos)"
      - "nao controla inclinacao, qualidade (Q flag), nem tipo morfologico entre os grupos"
    counterevidence:
      - "excluir as 4 galaxias de campo com ajuste de 2 pontos inverte o veredito binario (p=0.0635, informativo, nao pre-registrado)"
    prohibited_claims:
      - qualquer Problema do Millennium resolvido, aproximado, ou alcancavel
      - Tamesis confirmado, detectado, ou favorecido sobre LambdaCDM/MOND
        a partir deste teste isolado sem replicacao independente
      - novidade matematica/fisica sem citacao da fonte teorica exata em
        01_TAMESIS_CORE que motivou a hipotese
      - peer review formal ou publicacao -- este e um achado computacional
        interno, nao um artigo revisado
      - EFE CONFIRMED (ou qualquer linguagem categorica) -- o resultado
        correto e reportado como INCONCLUSIVO / FRAGIL

  - claim_id: DISC-CLAIM-002
    short_name: tamesis-internal-a0-derivation-holographic-bridge-survives-mond-emergence-falsified
    test_id: DISC-COSMOLOGY-MOND-SPARC-002
    exact_statement: >
      Das duas derivacoes internas conflitantes de a0 documentadas em
      01_TAMESIS_CORE (nunca antes testadas uma contra a outra nem contra
      dado real): (A) a0=cH0/(2pi) ("Ponte Holografica",
      Operational_Derivation/03_Holographic_Bridge/mond_derivation_proof.py:28,
      a0_A~=1,0824e-10 m/s^2) e (B) a0=cH0 ("MOND Emergence",
      Universe_Equation/02_MOND_Emergence/index.html:282, a0_B~=6,8009e-10
      m/s^2 -- alegacao numerica da propria linha 282, "~1,2e-10", ja
      aritmeticamente incorreta por fator ~5,7 independente de qualquer
      dado; o adversario de nulo desta sessao encontrou evidencia de que
      "1,2e-10" na linha 282 e provavelmente um copy-paste incorreto do
      RESULTADO da derivacao A, mal rotulado como B). NA AMOSTRA DE
      DESCOBERTA (120 galaxias, 2327 pontos, dado real SPARC): g-dagger
      ajustado=1,1977e-10 m/s^2 (0,2% do valor de McGaugh et al. 2016), IC
      bootstrap 95%=[6,76e-11, 2,78e-10]. a0_A DENTRO do IC (H_A
      sobrevive); a0_B FORA por fator ~2,5x (H_B falsificada). Reproduzido
      de forma independente com 0,004% de diferenca, robusto a espaco log
      e exclusao de outlier. NO HOLDOUT SELADO (55 galaxias, aberto pela
      primeira vez pelo Gate de Replicacao, 1062 pontos): g-dagger=4,1518e-10
      m/s^2, IC bootstrap 95%=[8,02e-11, 9,07e-10] -- largo o suficiente
      para conter TANTO a0_A QUANTO a0_B (BOTH_SURVIVE_INCONCLUSIVE),
      atribuivel a concentracao de leverage em 3 de 55 galaxias (91,7% da
      soma pooled de g_bar^2). O Gate nao contradiz o achado de descoberta,
      mas tambem nao o confirma de forma independente. Adversario de nulo
      dedicado testou sistematicas SPARC conhecidas (quality flag,
      inclinacao, erro de distancia ate 30% coerente) sobre a amostra de
      descoberta -- nenhuma desloca g-dagger o suficiente para reconciliar
      H_B (deslocamentos de 1-16%, precisaria de ~5,7x) -- mas encontrou
      que a0_A=cH0/(2pi) reproduz uma coincidencia numerica ja conhecida na
      literatura MOND padrao (Milgrom, decadas antes de Tamesis, ver
      arXiv:2001.09729), reduzindo o poder discriminativo especifico de
      Tamesis do achado, e que o IC de 95% de descoberta e largo o
      suficiente para que ~20-30% de um prior log-uniforme razoavel para
      a0 cairia dentro dele por acaso.
    evidence_level: preregistered_inconclusive
    preregistration_path: "02_TESTS/COSMOLOGY_A0_DERIVATION/PREREGISTRATION.md"
    preregistration_lock_commit: "d374210"
    data_provenance_path: "02_TESTS/COSMOLOGY_A0_DERIVATION/data/PROVENANCE.md"
    adversarial_review_verdict: CONFIRMED
    replication_status: REPLICATION_FAILED
    replication_gate_report_path: "02_TESTS/COSMOLOGY_A0_DERIVATION/analysis/result_gate_holdout.json"
    promoted_to_formal_lab: false
    dependencies: []
    known_gaps:
      - "Gate de Replicacao (holdout de 55 galaxias) resultou em REPLICATION_FAILED_INCONCLUSIVE -- o achado de descoberta (H_A sobrevive/H_B falsificada) e SUGESTIVO, nao confirmado de forma independente; o holdout nao teve poder estatistico para distinguir H_A de H_B (IC largo, dominado por 3 galaxias de alta luminosidade)"
      - "IC de 95% da amostra de descoberta e largo o suficiente que ~20-30% de um prior log-uniforme razoavel para a0 (1e-11 a 1e-8 ou 1e-11 a 1e-9 m/s^2) cairia dentro dele por acaso -- H_A sobreviver e evidencia real mas modesta (fator ~3-5x de poder discriminativo), nao rejeicao decisiva de candidatos genericos"
      - "a0_A=cH0/(2pi) reproduz uma coincidencia numerica ja conhecida na literatura MOND padrao (Milgrom, decadas antes de Tamesis, ver arXiv:2001.09729) -- H_A sobreviver nao e evidencia de poder discriminativo especifico de Tamesis, apenas consistencia com um fato numerico pre-existente no campo"
      - "testado contra sistematicas SPARC conhecidas (Q flag, corte de inclinacao Inc<30, erro de distancia aleatorio e sistematico coerente ate 30%) -- nenhuma desloca g-dagger por mais que ~1-16%, muito aquem do necessario para reconciliar H_B; a falsificacao de H_B na amostra de descoberta e robusta a essas sistematicas (verificado por agente debunker adversarial)"
      - "ajuste em espaco linear (nao o metodo exato do paper original, que usa peso/metodo mais sofisticado) -- scatter residual ~0,20 dex vs ~0,11-0,13 dex publicado; nao afeta o veredito binario na amostra de descoberta (checado por robustez em espaco log)"
      - "a0_A sobrevive dentro do IC nao significa que a derivacao 'Ponte Holografica' esteja provada correta -- apenas que nao foi falsificada pela amostra de descoberta; a tolerancia de 15% ja embutida no proprio script mond_derivation_proof.py e mais generosa que o IC empirico ali obtido"
      - "holdout consumido -- este split especifico (seed 20260812) nao pode ser reaberto para um teste cego futuro; uma investigacao de sequencia sobre a mesma pergunta exigiria um novo split e novo pre-registro"
    counterevidence:
      - "Gate de Replicacao no holdout (55 galaxias): g-dagger=4,1518e-10 m/s^2, IC 95%=[8,02e-11, 9,07e-10] -- a0_A e a0_B ambos dentro do IC, nao distingue as hipoteses. Nao contradiz o achado de descoberta, mas nao o confirma"
      - "a0_A=cH0/(2pi) e uma coincidencia numerica ja conhecida na literatura MOND padrao decadas antes de Tamesis (Milgrom, arXiv:2001.09729) -- reduz a forca do achado como evidencia especifica de Tamesis"
    prohibited_claims:
      - qualquer Problema do Millennium resolvido, aproximado, ou alcancavel
      - Tamesis confirmado, detectado, ou favorecido sobre LambdaCDM/MOND
        a partir deste teste isolado -- este teste e interno a Tamesis,
        nao compara Tamesis a nenhum modelo concorrente externo
      - a derivacao MOND Emergence (a0=cH0) permanece uma tese valida do
        corpo teorico Tamesis -- a amostra de descoberta falsifica
        especificamente essa derivacao contra dado real; ela deveria ser
        corrigida ou retirada em 01_TAMESIS_CORE, nao apenas notada aqui
        (o Gate inconclusivo no holdout nao reabilita a derivacao B --
        apenas nao a testou de forma decisiva)
      - a derivacao Holografica (a0=cH0/2pi) foi confirmada ou validada de
        forma independente por este teste -- o Gate de Replicacao no
        holdout foi INCONCLUSIVO, nao um REPLICATION_PASSED
      - peer review formal ou publicacao -- este e um achado computacional
        interno, nao um artigo revisado
      - REPLICATION_PASSED ou qualquer linguagem que sugira Gate de
        Replicacao completo bem-sucedido -- replication_status e
        REPLICATION_FAILED (inconclusivo, nao contraditorio)

  - claim_id: DISC-CLAIM-003
    short_name: zeta-zero-gap-runs-inverse-signal-real-lt-permuted-null
    test_id: DISC-RH-ZERO-GAP-RUNS-001
    exact_statement: >
      Motivado pela questao aberta arXiv:2412.15481 (existem infinitos
      runs de r gaps normalizados consecutivos >= c entre zeros de zeta?
      -- nao testavel com dado finito), este teste comparou a contagem de
      tais runs na sequencia REAL ordenada por altura de zeros de zeta
      (dado real, tabelas de Odlyzko) contra um modelo nulo de
      reordenacao aleatoria do mesmo multiconjunto de gaps (teste de
      permutacao, 10.000 replicas, grade pre-declarada c em
      {0,10;0,20;0,30} x r em {2;3}, Bonferroni). A hipotese pre-registrada
      previa MAIS runs no dado real (motivada por correlacao de Pearson
      negativa entre gaps consecutivos, -0,357, achado exploratorio da
      Fase 0). O resultado real foi o OPOSTO do previsto: em c=0,30 (r=2
      e r=3), a contagem real de runs ficou significativamente ABAIXO da
      distribuicao nula (p~=0,0001, muito abaixo do limiar de Bonferroni
      0,00833) tanto no dataset primario (100k zeros, alturas ate ~75.000)
      quanto no secundario (10k zeros, regime de altura ~10^12,
      completamente disjunto) -- consistencia cruzada de altura. Em
      c=0,10 e c=0,20 nenhum efeito significativo apos correcao. Reexecucao
      adversarial independente (codigo proprio, seed distinta) reproduziu
      as 12 contagens de runs relatadas BIT A BIT, descartou artefato de
      deriva/tendencia (correlacao posicao-vs-gap ~5x10^-5, indistinguivel
      de zero), e confirmou o padrao de crescimento do efeito com c como
      assinatura de poder estatistico coerente, nao cherry-picking.
    evidence_level: preregistered_falsified
    evidence_level_note: >
      "Falsificado" refere-se especificamente a direcao prevista pela
      hipotese H (mais runs no dado real). O teste NAO produziu um
      resultado nulo/sem-efeito -- encontrou um efeito real,
      estatisticamente forte e replicado (INVERSE_SIGNAL): o dado real
      tem MENOS runs de gaps grandes consecutivos que a reordenacao
      aleatoria, nao mais. Isto e consistente com a correlacao serial
      negativa entre gaps de zeta ja documentada na literatura GUE
      (Montgomery, Odlyzko) -- nao e uma descoberta matematica nova, e
      uma confirmacao numerica independente de estrutura ja conhecida,
      detectada por este metodo especifico nesta amostra especifica.
    preregistration_path: "02_TESTS/RH_ZETA_ZEROS/PREREGISTRATION.md"
    preregistration_lock_commit: "d110407"
    data_provenance_path: "02_TESTS/RH_ZETA_ZEROS/data/PROVENANCE.md"
    adversarial_review_verdict: CONFIRMED
    replication_status: REPLICATION_PASSED
    replication_gate_report_path: "02_TESTS/RH_ZETA_ZEROS/analysis/result_gate_third_dataset.json"
    promoted_to_formal_lab: false
    dependencies: []
    known_gaps:
      - "raciocinio direcional original da Secao 1 do pre-registro estava errado (previu mais runs, nao menos) -- a interpretacao mecanistica correta (correlacao negativa promove alternancia, nao persistencia) foi formulada DEPOIS de ver o resultado, o que e legitimo para INTERPRETAR um resultado ja travado e computado, mas nao deve ser confundido com ter previsto corretamente a direcao a priori"
      - "efeito so significativo em c=0,30 apos correcao de Bonferroni em TODOS os tres datasets (primario, secundario, terceiro do Gate) -- c=0,10 e c=0,20 nao mostram efeito detectavel; magnitude/robustez em c ainda mais estritos (c=0,40, 0,50) nao foi testada (nao estava na grade pre-declarada)"
      - "achado e uma confirmacao numerica de estrutura GUE ja conhecida na literatura (correlacao serial negativa entre gaps), nao uma descoberta matematica nova -- nao promovido a 04_FORMAL_RESEARCH_LAB apesar do REPLICATION_PASSED, ja que nao ha teorema novo a extrair, apenas verificacao numerica de fato ja estabelecido, confirmado pelo proprio adversario de nulo do Gate"
      - "adversario de nulo do Gate encontrou que o padrao de supressao de runs e uma consequencia GENERICA de correlacao serial negativa (reproduzido por simulacao sintetica AR(1)/copula Gaussiana sem nenhum conteudo de zeta) -- a alegacao substantiva especifica sobre zeta e apenas 'gaps de zeta tem correlacao serial negativa' (ja bem estabelecido na literatura GUE), nao que a estatistica de runs em si seja unicamente reveladora sobre zeta"
      - "nenhuma publicacao anterior encontrada implementando esta estatistica exata de runs via teste de permutacao sobre gaps de zeta (busca de literatura do adversario de nulo do Gate) -- o metodo e novo mesmo que o mecanismo subjacente (repulsao de nivel GUE) seja classico"
    counterevidence: []
    prohibited_claims:
      - qualquer confirmacao ou refutacao da conjectura arXiv:2412.15481
        em si (runs infinitos) -- essa afirmacao nao e testavel com dado
        finito; este teste avalia apenas uma pergunta proxy
      - qualquer alegacao de progresso sobre a Hipotese de Riemann
      - descoberta matematica nova -- a correlacao serial negativa entre
        gaps de zeta ja e conhecida na literatura GUE padrao; o proprio
        Gate confirmou que o padrao de runs e generico a qualquer
        sequencia com a mesma correlacao serial, nao especifico de zeta
      - peer review formal ou publicacao -- este e um achado computacional
        interno, nao um artigo revisado
      - promocao a 04_FORMAL_RESEARCH_LAB -- apesar do REPLICATION_PASSED,
        promoted_to_formal_lab permanece false (ver known_gaps)

  - claim_id: DISC-CLAIM-004
    short_name: zeta-zero-min-gap-scaling-confirms-gue-excludes-poisson-and-goe
    test_id: DISC-RH-GAP-EXTREME-VALUE-SCALING-001
    exact_statement: >
      Motivado pela constante de gaps pequenos de Inoue (2026,
      arXiv:2604.05733, liminf < 0,50895, RH-condicional -- nao testavel
      com dado finito), este teste perguntou, via teoria de valores
      extremos, se o gap normalizado minimo entre N zeros reais de zeta
      escala como N^(-1/3) (previsao GUE, repulsao de nivel) ou N^(-1)
      (Poisson, sem correlacao). Metodo: blocos nao-sobrepostos, grade N
      em {500;1000;2000;5000;10000} (199,99,49,19,9 blocos), mediana dos
      minimos de bloco, ajuste OLS de log(mediana) vs log(N), IC
      bootstrap 95% em beta (10.000 replicas). Resultado: beta observado
      = -0,3395, quase exatamente -1/3=-0,3333 (diferenca ~0,006). IC
      95% = [-0,3872; -0,2868] -- contem -1/3 folgadamente, exclui -1
      (Poisson) com folga grande. Checagem bonus (nao pre-registrada,
      informativa): o expoente GOE (-1/2) tambem cai fora do IC --
      discrimina especificamente a classe de universalidade GUE, nao so
      "GUE vs. aleatorio". Reexecucao adversarial independente reproduziu
      medianas de bloco e beta ajustado BIT A BIT, verificou o expoente
      teorico da Wigner surmise por calculo direto (nao assumido), e
      confirmou robustez removendo qualquer extremo da grade de N.
    evidence_level: preregistered_confirmed
    evidence_level_note: >
      H_GUE (expoente -1/3) sobreviveu ao IC; H_Poisson (-1) foi
      excluida com folga grande, robusta a remocao de qualquer extremo
      da grade. IMPORTANTE: o IC (largura ~0,10) discrimina
      DECISIVAMENTE GUE de Poisson, mas NAO tem precisao para confirmar
      que o expoente e EXATAMENTE -1/3 contra outros valores proximos
      nao motivados teoricamente (ex. -0,30, -0,35, -0,38 tambem caem
      dentro do IC) -- a interpretacao GUE e justificada pela
      fundamentacao teorica independente (Wigner surmise, universalidade
      GUE ja estabelecida na literatura para zeros de zeta), nao pela
      proximidade numerica de -0,3395 a -1/3 isoladamente. Nao
      superestimar como "confirma exatamente -1/3".
    preregistration_path: "02_TESTS/RH_GAP_EXTREME_VALUE_SCALING/PREREGISTRATION.md"
    preregistration_lock_commit: "db9bc89"
    data_provenance_path: "02_TESTS/RH_GAP_EXTREME_VALUE_SCALING/data/PROVENANCE.md"
    adversarial_review_verdict: CONFIRMED
    replication_status: NOT_SUBMITTED
    replication_gate_report_path: null
    promoted_to_formal_lab: false
    dependencies:
      - "DISC-CLAIM-003 (correlacao serial negativa entre gaps, REPLICATION_PASSED -- motiva a expectativa GUE testada aqui, mas este teste avalia uma propriedade estatistica distinta -- escala de valor extremo, nao correlacao serial)"
    known_gaps:
      - "IC discrimina GUE de Poisson com folga grande, mas nao tem precisao para confirmar o expoente exato -1/3 contra outros valores proximos nao motivados teoricamente -- ver evidence_level_note"
      - "com apenas 9 blocos em N=10000, o bootstrap da mediana tem discretizacao conhecida na literatura estatistica (Bickel & Freedman 1981) -- afeta a PRECISAO do IC nesse ponto extremo, nao a direcao/magnitude da conclusao (verificado por reexecucao adversarial: remover N=10000 da grade preserva o veredito)"
      - "erro de digitacao cosmetico no texto (nao no calculo) do pre-registro travado -- Secao 4 diz '99, 99, 49, 19, 9 blocos', deveria ser '199, 99, 49, 19, 9' (floor(99999/500)=199); nao corrigido por estar no documento travado, e nao afetou nenhum calculo em nenhum dos dois scripts (ambos usam floor division correta)"
      - "achado e uma confirmacao numerica de estrutura GUE ja conhecida na literatura (universalidade de zeros de zeta), nao uma descoberta matematica nova -- nao promovido a 04_FORMAL_RESEARCH_LAB"
      - "Gate de Replicacao completo nao acionado -- decisao pendente do usuario (exigiria zeros5.txt, regime #10^22, ja reservado mas nao baixado)"
    counterevidence: []
    prohibited_claims:
      - qualquer confirmacao ou refutacao da constante de Inoue 2026
        (liminf < 0,50895) em si -- essa afirmacao nao e testavel com
        dado finito; este teste avalia apenas uma pergunta proxy sobre
        lei de escala
      - qualquer alegacao de progresso sobre a Hipotese de Riemann
      - descoberta matematica nova -- a universalidade GUE de zeros de
        zeta ja e conhecida na literatura padrao (Montgomery, Odlyzko,
        Katz-Sarnak)
      - confirma exatamente o expoente -1/3 -- o IC nao tem precisao
        para isso, ver evidence_level_note
      - peer review formal ou publicacao -- este e um achado computacional
        interno, nao um artigo revisado
      - REPLICATION_PASSED ou qualquer linguagem que sugira Gate de
        Replicacao completo -- replication_status e NOT_SUBMITTED
# Cada claim registrado aqui segue o schema:
#   claim_id: DISC-CLAIM-NNN
#   short_name: <slug>
#   test_id: <id correspondente em 01_PORTFOLIO/TEST_QUEUE.yaml>
#   exact_statement: >
#     O que foi de fato encontrado, com numeros exatos.
#   evidence_level: <preregistered_confirmed | preregistered_falsified |
#                     preregistered_inconclusive | exploratory_only>
#   preregistration_path: "02_TESTS/<nome>/PREREGISTRATION.md"
#   preregistration_lock_commit: <hash>
#   data_provenance_path: "02_TESTS/<nome>/data/PROVENANCE.md"
#   adversarial_review_verdict: <CONFIRMED | REFUTED | INCONCLUSIVE | METHODOLOGY_FLAW_FOUND>
#   replication_status: <NOT_SUBMITTED | REPLICATION_PENDING |
#                         REPLICATION_PASSED | REPLICATION_FAILED>
#     -- NOT_SUBMITTED e o padrao: sobreviveu so a reexecucao adversarial
#     de primeira linha (AGENTS.md passo 7), nao ao Gate de Replicacao
#     (03_REPLICATION_GATE/PROTOCOL.md). Um claim REPLICATION_PASSED tem
#     peso evidencial maior que um so NOT_SUBMITTED -- essa e a distincao
#     que o Gate existe para capturar, ver RESEARCH_PIPELINE.md.
#   replication_gate_report_path: <path para o relatorio do Gate, se aplicavel>
#   promoted_to_formal_lab: <true | false>
#     -- so pode ser true se replication_status=REPLICATION_PASSED E o
#     claim tiver nucleo matematico demonstravel (RESEARCH_PIPELINE.md);
#     achados puramente empiricos (linha SPARC-*, por ex.) permanecem
#     false mesmo apos REPLICATION_PASSED -- nao ha teorema a extrair.
#   dependencies: []
#   known_gaps: []
#   counterevidence: []
#   prohibited_claims:
#     - qualquer Problema do Millennium resolvido, aproximado, ou alcancavel
#     - Tamesis confirmado, detectado, ou favorecido sobre LambdaCDM/MOND
#       a partir deste teste isolado sem replicacao independente
#     - novidade matematica/fisica sem citacao da fonte teorica exata em
#       01_TAMESIS_CORE que motivou a hipotese
#     - peer review formal ou publicacao -- este e um achado computacional
#       interno, nao um artigo revisado
