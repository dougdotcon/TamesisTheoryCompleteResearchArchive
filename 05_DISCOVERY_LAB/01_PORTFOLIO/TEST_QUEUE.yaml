      zeros1 (L=2155,04): V_hat=0,3600, z_A=-203,25, z_B=+14,66.
      zeros3 (L=210,50, RESULTADO ORIGINAL COM BUG -- ver correcao
      abaixo): V_hat=0,5182, z_A=-4,13, z_B=+0,00.
