  - test_id: DISC-RH-ZERO-GAP-RUNS-001
    title: "Runs de gaps moderados consecutivos entre zeros reais de zeta -- correlacao sequencial vs. reordenacao aleatoria"
    domain: matematica_pura
    parent_legacy: null
    related_tests:
      - "DISC-RH-REAL-001 (linha guarda-chuva; este e o primeiro sub-teste pre-registrado)"
    status: REPLICATION_PASSED
    existing_assets:
      - "02_TESTS/RH_ZETA_ZEROS/PREREGISTRATION.md"
      - "02_TESTS/RH_ZETA_ZEROS/data/PROVENANCE.md"
      - "02_TESTS/RH_ZETA_ZEROS/data/zeros4.txt"
      - "02_TESTS/RH_ZETA_ZEROS/analysis/run_preregistered_analysis.py"
      - "02_TESTS/RH_ZETA_ZEROS/analysis/result_primary.json"
      - "02_TESTS/RH_ZETA_ZEROS/analysis/adversarial_reproduction.py"
      - "02_TESTS/RH_ZETA_ZEROS/analysis/result_adversarial.json"
      - "02_TESTS/RH_ZETA_ZEROS/analysis/gate_third_dataset_replication.py"
      - "02_TESTS/RH_ZETA_ZEROS/analysis/result_gate_third_dataset.json"
    description: >
      Pergunta proxy falsificavel motivada pela questao aberta arXiv:2412.15481
      (existem infinitos runs de r gaps consecutivos normalizados >= c?
      nao testavel com dado finito). Testa em vez disso: a sequencia real
      ordenada por altura de gaps normalizados mostra correlacao
      sequencial de curto alcance (mais runs "todos >= c" do que uma
      reordenacao aleatoria do mesmo multiconjunto de valores)? Motivado
      por correlacao de Pearson negativa (-0,357) entre gaps consecutivos
      ja observada na Fase 0 (exploratoria, nao e a estatistica de teste).
      Grade pre-declarada: c em {0,10;0,20;0,30} x r em {2;3}, teste de
      permutacao (10.000 replicas), Bonferroni sobre as 6 celulas.
    result_summary: >
      VEREDITO: INVERSE_SIGNAL -- a hipotese H previu MAIS runs de gaps
      grandes consecutivos no dado real vs. nulo permutado; o resultado
      real foi o OPOSTO. Em c=0,30 (r=2 e r=3), a contagem real de runs
      ficou significativamente ABAIXO da distribuicao nula (p~0,0001,
      muito abaixo do limiar de Bonferroni 0,00833) -- essencialmente
      NENHUMA das 10.000 permutacoes teve contagem tao baixa quanto o
      dado real ordenado. Em c=0,20 o efeito e sugestivo mas nao cruza o
      limiar corrigido (p~0,02). Em c=0,10 sem efeito detectavel. MESMO
      padrao replicado no dataset secundario (zeros3.txt, regime de
      altura ~10^12, completamente disjunto): significativo em c=0,30
      (p~0,001 e p~0,0001), nao significativo em c<=0,20 -- consistencia
      cruzada de altura fortalece a confianca de que o efeito e real, nao
      um artefato de uma amostra especifica. INTERPRETACAO CORRIGIDA: a
      correlacao negativa entre gaps vizinhos (-0,357, achado da Fase 0)
      na verdade SUPRIME runs de gaps grandes consecutivos (correlacao
      negativa promove alternancia, nao persistencia) -- o raciocinio
      direcional da Secao 1 do pre-registro estava ERRADO na direcao,
      mas o teste capturou corretamente um efeito real na direcao oposta,
      exatamente o cenario INVERSE_SIGNAL que o proprio pre-registro
      exigia reportar de forma proeminente, nao escondido.
    adversarial_verdict: CONFIRMED
    adversarial_verdict_detail: >
      Reexecucao independente (agente separado, codigo proprio escrito
      antes de ler o script primario, seed distinta) reproduziu as 12
      contagens de runs relatadas (6 celulas x 2 datasets) BIT A BIT --
      concordancia exata, nao aproximada. Nenhum bug encontrado (formula
      de gap normalizado, contagem de runs vetorizada vs. loop ingenuo,
      preservacao de multiconjunto na permutacao, parsing do cabecalho de
      zeros3.txt, aplicacao do limiar de Bonferroni -- todos conferidos
      de forma independente). Checagem de artefato de deriva/tendencia
      (a preocupacao mais seria: um efeito de tendencia lenta ao longo da
      faixa de altura poderia produzir o mesmo padrao estatistico por um
      mecanismo totalmente diferente, sem relacao com correlacao
      sequencial real): correlacao entre indice de posicao e gap
      normalizado = ~5x10^-5 em ambos os datasets -- indistinguivel de
      zero, artefato descartado. Padrao de crescimento do efeito com c
      (nao significativo em 0,10, sugestivo em 0,20, forte em 0,30)
      avaliado como assinatura estatistica coerente de poder de teste
      (fracao de gaps "pequenos" cresce de 0,1% para 2,1% entre c=0,10 e
      c=0,30, dando mais poder para distinguir ordem real de ordem
      aleatoria), nao evidencia de cherry-picking -- a grade completa de
      6 celulas foi travada antes de qualquer calculo.
    gate_replication_result: >
