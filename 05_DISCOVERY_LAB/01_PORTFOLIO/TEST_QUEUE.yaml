      SINTETICOS com parametro artificial, dado real so mostra
      classificacao estatica (e essa classificacao esta sob disputa ativa
      em 2025); (5) spacing-statistics-rmt-non-zeta -- dado real (niveis
      nucleares RIPL-3, autovalores de rede SNAP) e computacao real
      executados, mas falha em identificabilidade (previsao identica ao
