      do zero, forca bruta, reproducao minima do bug): zeros3
      V_hat=0,4272, z_A=-160,76 (nao -4,13), z_B=-18,29 (nao +0,00).
      zeros1 nao afetado (arredondamento caiu do lado seguro), bate
      exatamente. Correcao integrada no proprio PREREGISTRATION.md
      (adendo datado, texto original preservado intacto), autorizada
      como correcao de implementacao (nao reformulacao de hipotese),
      mesma disciplina de AGENTS.md passo 7.
    corrected_result: >
      Veredito de topo pela regra ternaria travada (regra em si
      inalterada): INCONCLUSIVE (nem BERRY_FAVORED nem GUE_FAVORED
      satisfeitos). Subcaso CORRIGIDO: NEITHER_MODEL (nao
      PARTIAL_DISAGREEMENT como reportado originalmente) -- os dois
      datasets, de forma consistente, rejeitam formalmente os DOIS
      modelos pelo limiar de 2-3 sigma pre-declarado (zeros1: |z_A|=203
