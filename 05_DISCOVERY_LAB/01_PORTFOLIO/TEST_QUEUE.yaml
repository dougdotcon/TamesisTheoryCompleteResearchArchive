      intermediate_alpha_search: >
        Mecanismo com alpha em (1/2,1) ENCONTRADO e CONFIRMADO
        (DISC-DEC-022, frente b), com correcao de enquadramento apos
        reproducao adversarial. M-WEIB(beta): manter destino uniforme
        de M-U, variar a TAXA de reroteamento em forma de Weibull
        Lambda(t)=c*t^beta em vez de q(s). Identidade H(t)=t*Lambda(t)/c
        (MAIS geral do que alegado -- vale para qualquer perfil Lambda
        deterministico, achado extra do adversarial). Forma fechada
        phi_WEIB(c;beta)=int_0^1 e^(-c*t^(1+beta))dt, alpha=1/(1+beta)
        em (1/2,1) para beta em (0,1). CORRECAO: a alegacao de que o
        mecanismo estava "genuinamente fora da familia M-q" e FALSA
        para beta<1 -- o adversarial resolveu a formula-mestre e
        encontrou q(t)=[(1+beta)t^beta-beta*t^(1+beta)-t]/(1-t),
        permanecendo em [0,1] para todo beta em (0,1) testado, ou seja
        M-WEIB(beta<1) E um membro da familia M-q, com este q(t) como
        realizacao explicita antes desconhecida -- resposta a pergunta
        original fica MAIS forte (resolvida dentro do arcabouço ja
        classificado, nao fora dele). Para beta>1 (ex. beta=2, q_min=
        -0,125) q(t) sai de [0,1] -- so esse lado sai genuinamente de
        M-q, confirmando por completo o corolario de quebra do piso
        alpha>=1/2 (unico resultado que precisava estar fora de M-q, e
        esta). Busca de literatura (15 buscas): nenhum processo nomeado
        e, por reinterpretacao, um M-q com beta em (0,1) -- achado
        estrutural: variacao regular natural sempre entra numa TAXA/
        FUNCAO GERADORA (ilimitada), nunca numa probabilidade
        condicional limitada com o perfil exigido. MECANISMO_ALPHA_
