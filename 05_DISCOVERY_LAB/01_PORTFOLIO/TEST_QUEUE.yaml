      ja auditado de permutation_entropy como estimador de robustez,
      sub-janelamento para nao-estacionariedade, protocolo de nulo
      substituto DUPLO (IAAFT primario + deslocamento circular
      companheiro, Quian Quiroga et al. 2002 -- territorio genuinamente
      novo desta linha), mitigacao obrigatoria pre-declarada de
      propagacao de onda compartilhada para o dominio sismico
      (binning RMS em vez de forma de onda bruta). VALIDACAO SINTETICA:
      passou sem necessidade do passo de correcao pre-autorizado --
      controle positivo (AR(1) acoplado) mostrou poder discriminativo
      forte nos 4 canais sob os 2 nulos (p=0,0), controle negativo com
      taxa de falso-positivo compativel com o nivel nominal (~8,3%).
      REAL: CHB-MIT EEG (chb01_03.edf, onset de convulsao, eletrodos
      FP1-F7/T7-P7) e par de terremotos de Kahramanmaras, Turquia
