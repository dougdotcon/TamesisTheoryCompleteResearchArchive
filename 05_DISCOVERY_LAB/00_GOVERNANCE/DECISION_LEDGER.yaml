      estatistica de ε-machines/C_mu -- provada matematicamente
      distinta do C_JS ja fechado). Ambos os 2 candidatos foram
      formalizados, validados sinteticamente, e fechados: transferencia
      de entropia mostrou um achado forte em dado real (terremotos de
      Kahramanmaras, Turquia) sob os 2 nulos substitutos, mas a
      reproducao adversarial obrigatoria descobriu um artefato
      instrumental de baixa frequencia especifico de uma estacao
      (nao sinal sismico real) que, uma vez filtrado corretamente, fez a
      significancia desaparecer por completo; complexidade de
      ε-machines fechou na etapa de validacao sintetica, sem
      estabelecer poder discriminativo em nenhum dos 3 controles
      positivos computaveis mesmo apos a unica correcao pre-autorizada.
      Isto completou a Fase 0.8 e, com ela, os 16 candidatos
      identificados nesta linha desde sua criacao (3 da Fase 0 original
      + 4 da Fase 0.5 + 4 da Fase 0.6 + 3 da Fase 0.7 + 2 da Fase 0.8) --
      pela primeira vez desde a criacao da linha, nenhuma candidatura
      formulada permaneceu sem teste. Uma sintese retrospectiva
      completa (02_TESTS/TRI_RG/CLOSURE_SUMMARY.md, escrita como parte
      deste encerramento) revelou que os 16 candidatos, apesar de
      parecerem ideias distintas, colapsam estruturalmente em ~4 eixos
      matematicos latentes independentes (persistencia/taxa-de-entropia;
      taxa de relaxacao local; densidade de recorrencia via embedding de
      Takens/Hankel -- estruturalmente fragil para dado real fracamente
      correlacionado, responsavel por 3 dos 4 fechamentos na etapa de
      validacao; estatistica de cauda/eventos extremos) -- e que mesmo
      os 2 candidatos da Fase 0.8, desenhados especificamente para
      escapar desses eixos, nao produziram invariante sobrevivente.
      Diante de 16 tentativas genuinamente distintas, com disciplina
      metodologica completa (validacao sintetica obrigatoria,
      reproducao adversarial obrigatoria para qualquer achado positivo,
      escalonamento de "uma correcao delimitada, depois fechar"),
      resultando em 4 achados brutos p<0,05 refutados por reproducao
      adversarial e 4 fechamentos na propria etapa de validacao, o
      usuario decidiu encerrar a linha formalmente em vez de autorizar
      uma 6a rodada de busca.
