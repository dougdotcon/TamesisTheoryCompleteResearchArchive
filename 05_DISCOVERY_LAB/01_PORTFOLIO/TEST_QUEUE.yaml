      ajuste linear via criterio de convergencia de Kantz-Schreiber
      2004 + gate de R²>=0,95 (refinamento mecanico adicionado durante
      diagnostico de correcao de codigo, ANTES de qualquer controle
      estocastico -- corrige um bug real onde o plato de saturacao de
      um atrator caotico limitado seria trivialmente "estavel"),
      I(X)=lambda_1 (primario) + D2 (companheiro, dimensao de
      correlacao de Grassberger-Procaccia). VALIDACAO SINTETICA:
      tentativa 1 (PRE=ruido branco) reproduziu EXATAMENTE a mesma
      parede estrutural do RQA -- FNN nunca resolve m<=10 para ruido
      branco/fGn fracamente correlacionado (curva de fracao de FNN
      quase identica a do RQA), bloqueando os 2 canais simultaneamente;
      confirmado via bootstrap (0/25 reamostras resolveram embedding)
      que e parede estrutural, nao falta de poder do IAAFT. Acionou o
      redesenho pre-autorizado (mesmo gatilho mecanico do RQA):
      tentativa 2 (PRE=fGn H=0,7, POST=Rossler rank-remapeado) resolveu
