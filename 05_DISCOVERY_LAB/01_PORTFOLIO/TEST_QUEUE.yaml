    existing_assets:
      - "02_TESTS/COSMOLOGY_WIDE_BINARIES_MC_DEPROJECTION/PREREGISTRATION.md (LOCKED 2026-08-15, apos revalidacao do Adendo 4c passar)"
      - "02_TESTS/COSMOLOGY_WIDE_BINARIES_MC_DEPROJECTION/data/{hwang_eccentricity_subset.parquet,PROVENANCE_HWANG.md}"
      - "02_TESTS/COSMOLOGY_WIDE_BINARIES_MC_DEPROJECTION/analysis/{deprojection_common.py,delta_obs_newt.py} (validados, prontos para dado real)"
      - "reaproveita sem modificacao: 02_TESTS/COSMOLOGY_WIDE_BINARIES/data/{PROVENANCE.md,quality_filtered_sample.parquet,discovery_holdout_split.json,mamajek_mass_luminosity.tsv} e analysis/apply_quality_cuts.py"
    description: >
      Usuario pediu para redesenhar SPARC-003 com desprojecao Monte Carlo
      completa. Pesquisa dedicada (nao memoria) verificou o algoritmo
      exato de Chae (2023) via leitura direta do LaTeX-fonte
      (arXiv:2305.04613v4) e confirmou, por download e inspecao real, que
      o catalogo eletronico de excentricidades de Hwang, Ting & Zakamska
      (2022, MNRAS 512:3383, arXiv:2111.01789 -- correcao de citacao: NAO
      e "Hamers, Kratter & Shu" como presumido inicialmente) esta de fato
      acessivel (208MB FITS, 1.817.594 linhas, cobertura total do
      El-Badry+2021, sha256 verificado). Achado decisivo: o metodo
      primario de Chae NAO ajusta a0 livre -- usa uma estatistica
      diferente (delta_obs-newt, residuo de log g vs log g_N
      DESPROJETADOS) que nao sofre da restricao de imagem (1,+inf) que
      matou a tentativa anterior. Pre-registro DRAFT escrito adaptando
      essa estatistica para testar H_A/H_B especificamente (extensao
      declarada, nao literal do artigo), reaproveitando H_A/H_B, catalogo,
      cortes de qualidade e split discovery/holdout de SPARC-003 sem
      modificacao. Simplificacao declarada: correcao de multiplicidade
      oculta (f_multi) de Chae NAO implementada -- vies unidirecional
      conhecido (infla g/g_N), checagem adversarial obrigatoria se o
      resultado mostrar g/g_N>1 consistente com H_A ou H_B.
    lock_result: >
      2026-08-15: catalogo de Hwang extraido (100% de cobertura dos
      43.147 sistemas, 88,53% via excentricidade individual, 11,47% via
      fallback populacional). Pipeline de desprojecao vetorizada
      construida e validada geometricamente (excentricidade zero
      recupera g/g_N~1 exatamente). Primeira validacao sintetica (g/g_N
      bruto) FALHOU no criterio literal -- mediana -0,204 dex sob
      Newtoniano puro real, nao um bug, mas o efeito Kepleriano
      conhecido de v^2/r subestimar g_N sob orbita excentrica (bate com
      a propria Eq. 16 de Chae). Corrigido ANTES de qualquer dado real:
      estatistica passou a ser delta_obs-newt (real menos mock
      Newtoniano casado por sistema) -- o metodo original de Chae, que
      este pre-registro havia simplificado por engano. Revalidacao sob
      a estatistica corrigida PASSOU (controle negativo: 5 ICs de 95%
      contem 0; controle positivo: sinal MOND injetado recuperado
      corretamente no unico bin onde e fisicamente detectavel acima do
      piso de ruido, razao 1,44). Pre-registro travado (LOCKED). Nenhum
      dado real de saida (v_p observado) foi tocado ate este ponto --
      toda a validacao/revalidacao usou dado sintetico dos dois lados.
    stage2_lock: >
      2026-08-22 (DISC-DEC-029): PREREGISTRATION_STAGE2.md travado
      (LOCKED), promovido sem alteracao de conteudo do rascunho
      PREREGISTRATION_STAGE2_DRAFT.md (preservado como registro de
      auditoria) apos revisao explicita dos 4 judgment calls nomeados
      (N_MC=200, N_bootstrap=2000, SEED_STAGE2=20260822 aprovados;
      risco de descasamento de semente corrigido via parametro aditivo
      return_raw em calibrate_f_multi(), nao so' documentado). Checklist
      completo de revalidacao sintetica (Sec.9) reexecutado sob
      N_bootstrap=2000 nos 5 cenarios -- 7/7 criterios A1-A4/B1-B3
      continuam passando. Calculo sobre a amostra de descoberta real
      (30.203 sistemas) autorizado a partir deste lock; holdout selado
      (12.944 sistemas) permanece linha vermelha explicita, intocado.
    next_action: >
      Nenhuma obrigatoria -- SPARC-FMULTI-STAGE2 concluido e fechado
      CLOSED_INCONCLUSIVE (ver fmulti_stage2_final_result abaixo).
      Reabertura futura legitima exigiria calibrar f_multi
      condicionalmente a RUWE (ou covariavel de qualidade astrometrica
      similar) em vez de um parametro escalar unico -- exige seu proprio
      pre-registro, nao uma correcao deste. Holdout selado (12.944
      sistemas) permanece intocado, disponivel para essa tentativa
      futura.
    fmulti_stage1_results: >
      2026-08-22 (DISC-DEC-023, retomada como SPARC-FMULTI-STAGE1):
      pipeline de auto-calibracao completa de f_multi (Chae Eqs. 11-13 +
      procedimento iterativo do Artigo A/B) implementado e validado
      inteiramente sobre dado sintetico -- 7 criterios pre-declarados
      (A1-A4, B1-B3) passaram em 5 cenarios independentes. Validacao A
      (populacao 100% Newtoniana, f_multi_true=0,00/0,35/0,47): f_multi
      recuperado dentro de 0,05 nos 3 cenarios, correcao generaliza para
      todos os 5 bins (nao so o bin-ancora). Validacao B (a0_true=1,2e-10
      + f_multi_true=0,35/0,47 simultaneos): pipeline SEM correcao repete
      o modo de falha catastrofico ja visto no dado real desta linha
      (a0_fit 17x/57x o valor verdadeiro); COM auto-calibracao, erro cai
      para um residuo de 0,15-0,22 dex (fator 1,4-1,6x) -- grande melhora,
      mas NAO recuperacao perfeita (1 dos 2 cenarios teve o IC95% por
      pouco nao conter a0_true), causa raiz ja identificada a priori (
      modelo simplificado de wobble de fotocentro nao decai corretamente
      com g_N, herdado sem alteracao de hidden_companion_check_v2.py).
      Verificacao adversarial independente (2 agentes, DISC-DEC-023):
      Frente 1 (proveniencia das equacoes de Chae, refetch direto dos
      e-prints .tex de arXiv:2305.04613/2309.10404) -- SOUND, so' um nit
      de citacao interna sem efeito em nenhuma formula usada. Frente 2
      (auditoria adversarial de codigo/circularidade/numeros) -- os 5
      checks substantivos (circularidade, numeros, ausencia de dado real,
      logica, sanidade estatistica) passaram limpos; achou 1 problema
      moderado (METHODOLOGY_ADDENDUM.md alegava ordem temporal
      escrito-antes-de-rodar que os timestamps contradiziam -- os
      limiares numericos de fato estavam fixados em codigo antes das
      execucoes, sem evidencia de ajuste pos-hoc; corrigido via adendo
      datado) e 1 lacuna de robustez real em fit_a0() (sem filtro de
      a0<=0, ao contrario de bootstrap_a0_refit() -- corrigido no codigo,
      nao afetou nenhum numero ja reportado, reexecucao confirmou
      resultados identicos). Ver
      02_TESTS/COSMOLOGY_WIDE_BINARIES_MC_DEPROJECTION/fmulti_selfcal_stage1/{METHODOLOGY_ADDENDUM.md,PROVENANCE_CHAE_EQS.md,RESULTS_SUMMARY_STAGE1.md,ADVERSARIAL_VERIFICATION.md}.
      Nenhum dado real (descoberta ou holdout) foi tocado -- confirmado
      por 2 verificacoes independentes.
    fmulti_stage2_final_result: >
      2026-08-22 (DISC-DEC-032): SPARC-FMULTI-STAGE2 fechado
      CLOSED_INCONCLUSIVE. Analise primaria real (30.203 sistemas):
      f_multi_hat=0,103666 (calibrado, converged_bracket=True),
      delta_obs-newt corrigido=[+0,0777;+0,0657;+0,0486;+0,0417;
      -0,0002], a0_fit=6,125e-11 m/s2 (IC95% [4,1196e-11;8,5808e-11],
      N_bootstrap=2000). Veredito mecanico BOTH_FALSIFIED (a0_A e a0_B
      ambos fora do IC); camada interpretativa obrigatoria (correcao
      pelo vies residual do Estagio 1) NAO resgata nenhuma hipotese.
      Reproducao adversarial independente (driver do zero, so' do
      pre-registro) confirmou todos os numeros a precisao de ponto
      flutuante -- CONFIRMED, nenhum bug de codigo. Debunker obrigatorio
      investigou 3 explicacoes convencionais (todas reais mas
      insuficientes sozinhas: selecao correlacionada com RUWE nos cortes
      ja aplicados; imperfeicao do modelo de wobble; variacao normal de
      literatura) e desenhou uma 4a checagem decisiva: dividir a amostra
      por RUWE mostra que o subgrupo RUWE-alto (19,15% da amostra)
      permanece com excesso estatisticamente robusto (+0,171 dex, IC95%
      [0,126;0,212], inteiramente acima de zero) mesmo no bin-ancora
      apos a correcao -- o modelo de f_multi escalar unico esta mal
      especificado para a heterogeneidade real da amostra. Veredito
      BOTH_FALSIFIED nao aceito. Registrado como DISC-CLAIM-008. Holdout
      selado (12.944 sistemas) nunca tocado, confirmado por grep
      independente em ambos os agentes. Ver
      02_TESTS/COSMOLOGY_WIDE_BINARIES_MC_DEPROJECTION/fmulti_selfcal_stage1/{RESULTS_PRIMARY_STAGE2.md,adversarial_stage2/ADVERSARIAL_DEBUNKER_REPORT.md}.
    final_result: >
      2026-08-18: analise primaria v1 sobre os 30.203 sistemas de
      descoberta produziu delta_obs-newt=[+0,2274;+0,1723;+0,1313;
      +0,1027;+0,0467], a0_fit=3,634e-10 (IC95%
      [2,944e-10;4,494e-10]), BOTH_FALSIFIED bruto. Reexecucao
      adversarial bit a bit confirmou v1 sem bug nos arquivos travados,
      mas a descoberta adversarial de nulos obrigatoria (AGENTS.md passo
      7) achou um BUG DE IMPLEMENTACAO real: o ramo mock nao carregava
      ruido astrometrico Gaia, enquanto o ramo real carrega (vies de
      Rice/Rayleigh nao cancelado pela subtracao real-mock) -- prova
      decisiva via teste 100% sintetico (injetar o mesmo ruido
      simetricamente nos dois ramos colapsa o efeito a zero). Corrigido
      (Secao 5b do pre-registro), revalidado sob os controles negativo/
      positivo do Adendo 4c, analise real re-executada: v2 produz
      delta_obs-newt=[+0,1486;+0,1482;+0,1150;+0,0949;+0,0430] (~5x
      menor), a0_fit=1,657e-10 (IC95% [1,232e-10;2,181e-10]) -- a0_A
      cai logo ABAIXO do IC (margem ~0,057 dex), a0_B claramente fora.
      Reexecucao adversarial v2 confirmou bit a bit. O gatilho
      pre-declarado de multiplicidade oculta (g/g_N real bruto>1 no bin
      0) ativou a checagem adversarial obrigatoria: com o sinal v2
      corrigido (bem menor que v1), inflacao de massa por companheiras
      nao resolvidas SOZINHA ja cobre 23-146% do sinal por bin, a
      diferenca RUWE-alto/baixo excede o sinal real total em varios
      bins, e mesmo f_multi=0,25 (limite inferior da faixa
      observacional da literatura) produz sinal sintetico (zero MOND)
      MAIOR que o sinal real inteiro nos 5 bins. Veredito bruto
      BOTH_FALSIFIED da Secao 5 NAO aceito -- a Secao 4 ja pre-
      comprometia essa regra antes de ver dado real. Fechado
      CLOSED_INCONCLUSIVE. Registrado como DISC-CLAIM-006. Detalhes:
      02_TESTS/COSMOLOGY_WIDE_BINARIES_MC_DEPROJECTION/PREREGISTRATION.md
      Secao 7; 09_SESSIONS/2026/2026-08-18_SPARC004_MC_DEPROJECTION.md.
    stop_condition: >
      travar o pre-registro (Status: LOCKED) antes da validacao sintetica
