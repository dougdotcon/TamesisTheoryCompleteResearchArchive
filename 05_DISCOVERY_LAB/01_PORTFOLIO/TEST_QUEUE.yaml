      fecharem sem invariante confiavel. 5 agentes independentes em
      paralelo investigaram 5 candidatos genuinamente novos (nenhuma
      reformulacao leve dos 7 ja testados). RESULTADO: 4 viable=true, 1
      viable=false. (1) Entropia de permutacao + plano complexidade-
      entropia (Bandt-Pompe/Rosso) -- melhores regras de parametro nao-
      arbitrarias depois do RQA, 2 dominios novos fortes (VitalDB
      inducao de anestesia, PhysioNet European ST-T isquemia), risco de
      redundancia com Hurst documentado (H_S) mas discriminador C_JS
      nunca testado na literatura. (2) Kramers-Moyal/Friedrich-Peinke
      (reconstrucao de Fokker-Planck) -- regra de selecao de lambda mais
      principiada de toda a linha (teste de Markov-Einstein orientado a
      dado), 2 dominios novos (choque SNB EUR/CHF tick-a-tick, vfdb com
      ~10 transicoes dentro do mesmo registro), risco de redundancia com
      CSD confirmado analiticamente (Ritchie & Sieber 2016) mas canal de
      escape real (forma do potencial, Livina & Lenton). (3) Homologia
      persistente/TDA -- matematica mais distinta (topologia), dominio
      inedito (LIGO GW150914), mas UNICO candidato com checagem empirica
      propria de redundancia ja rodada nesta sessao mostrando risco
      concreto (r≈0,92) contra RQA (que nem chegou a tocar dado real).
      (4) Indice de cauda EVT/Hill -- bem fundamentado, 2 dominios novos
      (onda de calor 2021, furacao Florence/Cape Fear), risco de
      redundancia com SOC real via principio do grande-salto-unico, mais
      confundidores mundanos adicionais em ambos os dominios. (5) RG de
      block-spin literal sobre serie binarizada -- viable=false, fechado
      por identificabilidade ANALITICA (decimacao de Ising 1D forca
      fluxo trivial para qualquer processo de correlacao de curto
      alcance; quando tem poder, colapsa em Hurst) sem tocar dado real,
      mesmo espirito de spacing-statistics-rmt-non-zeta na Fase 0.
      Ranking honesto (nao travado): permutacao+CECP > Kramers-Moyal >
      TDA > EVT/Hill. Detalhes completos em
      phase0/PHASE0_6_SURVEY_NEW_CANDIDATES.md.
