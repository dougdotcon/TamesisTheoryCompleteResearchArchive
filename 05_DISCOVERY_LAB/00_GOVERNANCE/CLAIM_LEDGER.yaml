  - claim_id: DISC-CLAIM-010
    short_name: schumann-resonance-sierra-nevada-elf-station-does-not-distinguish
    test_id: DISC-SCHUMANN-RESONANCE-001
    exact_statement: >
      Em dado real da estacao ELF de Sierra Nevada (Zenodo, ano 2014,
      subconjunto de 3 dias completos x 2 canais NS/EW, taxa de
      amostragem real confirmada 256,0164 Hz), a PSD de Welch (janela
      Hann, 64s, 50% sobreposicao) mostra em 6/6 pares canal x segmento
      um pico dominante na janela 5-10 Hz localizado entre 7,81-8,03 Hz
      (5/6 casos) ou 8,50 Hz (1/6 caso, fora da banda por 0,15 Hz), mas
      com proeminencia (razao pico/mediana da vizinhanca +-1 Hz) de
      apenas 1,22x-1,44x -- abaixo do limiar travado de 3x para SUPORTA.
      Um morro espectral largo real (confirmado por metodo independente
      de extrapolacao de fundo) existe na localizacao esperada, mas nao
      atinge a proeminencia exigida. SUPORTA nao se aplica em nenhum
      caso, sob nenhuma leitura textual do criterio. A classificacao
      entre NAO DISTINGUE (leitura adotada, favorecida tanto pela
      frente quanto pelo referee independente) e FALSIFICA (leitura
      alternativa mais estrita) depende de uma ambiguidade textual
      genuina no proprio pre-registro, nao de um erro de nenhum agente.
    evidence_level: preregistered_inconclusive
    preregistration_path: "02_TESTS/SCHUMANN_RESONANCE/PREREGISTRATION.md"
    preregistration_lock_commit: "ec42b65"
    data_provenance_path: "02_TESTS/SCHUMANN_RESONANCE/data/PROVENANCE.md"
    adversarial_review_verdict: SOUND_WITH_NAMED_ISSUES
    replication_status: NOT_SUBMITTED
    replication_gate_report_path: null
    promoted_to_formal_lab: false
    dependencies: []
    known_gaps:
      - "estacao unica (Sierra Nevada) -- nao generaliza para outras estacoes/instrumentos sem novo pre-registro"
      - "ambiguidade textual genuina no criterio de decisao do pre-registro entre NAO DISTINGUE e FALSIFICA (Secao 5) -- registrada, nao resolvida retroativamente"
      - "sob a leitura adotada (NAO DISTINGUE), o ramo FALSIFICA fica quase inatingivel sob medias pesadas de Welch -- fraqueza de desenho do criterio, nomeada pelo referee"
      - "checagem de harmonicos (contexto qualitativo, nao parte do criterio travado) revelou uma feicao de interferencia de banda estreita nao-Schumann perto de 15,1-15,2 Hz, nao investigada"
