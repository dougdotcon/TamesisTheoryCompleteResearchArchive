schema: tamesis-decision-ledger/1
decisions:
  - decision_id: DEC-001
    date: 2026-07-28
    decision: "Criar camada formal isolada sem modificar o legado."
    rationale: "Conflito entre narrativa histórica e auditorias canônicas."
    authority: LAB0_ARCHITECTURE_EXECUTION_AUTHORIZED
    affected_paths:
      - "04_FORMAL_RESEARCH_LAB/"
    reversibility: reversible
  - decision_id: DEC-002
    date: 2026-07-28
    decision: "O primeiro alvo matemático futuro é RH-NOGO-001, mas não é executado no LAB-0."
    rationale: "Aproveita ativos negativos e espectrais sem alegar RH."
    authority: LAB0_ARCHITECTURE_EXECUTION_AUTHORIZED
    affected_paths:
      - "03_MILLENNIUM/01_RIEMANN/"
    reversibility: reversible
  - decision_id: DEC-003
    date: 2026-07-28
    decision: "Lean é verificador principal; Python é exploratório e falsificacional."
    rationale: "Separar prova formal de busca computacional."
    authority: LAB0_ARCHITECTURE_EXECUTION_AUTHORIZED
    affected_paths:
      - "05_FORMAL/"
      - "06_COMPUTATION/"
    reversibility: reversible
  - decision_id: DEC-004
    date: 2026-07-28
    decision: "Smoke build não conclui LAB-BENCH-001; restaurar o benchmark como item ativo antes de qualquer frente Clay."
    rationale: "O benchmark exige especificação, execução e verificação separadas, além de toolchain definitivo e Mathlib fixada."
    authority: LAB_BENCHMARK_FORMALIZATION_PREPARATION_AUTHORIZED
    affected_paths:
      - "LAB_STATE.md"
      - "01_PORTFOLIO/RESEARCH_QUEUE.yaml"
      - "05_FORMAL/specifications/LAB-BENCH-001.md"
    reversibility: reversible
  - decision_id: DEC-005
    date: 2026-07-28
    decision: "Interromper LAB-0.6 antes da instalação do toolchain e Mathlib porque o HEAD não contém o baseline do laboratório."
    rationale: "O diff inteiro é não rastreado; não é possível criar um commit exclusivo da reconciliação LAB-0.5 nem congelar lab0-result.json historicamente."
    authority: LAB_BENCHMARK_FORMALIZATION_PREPARATION_AUTHORIZED
    affected_paths:
      - "04_FORMAL_RESEARCH_LAB/"
    reversibility: reversible
  - decision_id: DEC-006
    date: 2026-07-28
    decision: "Interromper LAB-0.6 após timeout da instalação oficial do toolchain definitivo."
    rationale: "O ambiente continua dependente de .tmp; Mathlib não pode ser fixada nem testada honestamente."
    authority: LAB_BENCHMARK_FORMALIZATION_PREPARATION_AUTHORIZED
    affected_paths:
      - "05_FORMAL/LEAN_ENVIRONMENT.md"
      - "lab0.6-environment-result.json"
    reversibility: reversible
  - decision_id: DEC-007
    date: 2026-07-28
    decision: "Aceitar toolchain definitivo e lock da Mathlib, mas interromper antes do benchmark porque o smoke import Mathlib excedeu o timeout."
    rationale: "A infraestrutura foi estabilizada; a importação completa exige compilação local extensa e não produziu PASS verificável neste gate."
    authority: LAB_BENCHMARK_FORMALIZATION_PREPARATION_AUTHORIZED
    affected_paths:
      - "05_FORMAL/lean/lakefile.toml"
      - "05_FORMAL/lean/lake-manifest.json"
      - "05_FORMAL/lean/TamesisLab/Tests/MathlibSmoke.lean"
    reversibility: reversible
  - decision_id: DEC-008
    date: 2026-07-28
    decision: "Classificar LAB-0.7 como indisponibilidade de cache/recurso e manter LAB-BENCH-001 bloqueado."
    rationale: "O checkout coincide com o manifesto, mas cache get falhou com recurso ausente, Mathlib.olean está ausente e o alvo isolado excedeu 600 segundos."
    authority: LAB_MATHLIB_SMOKE_RECOVERY_AUTHORIZED
    affected_paths:
      - "lab0.7-mathlib-smoke-result.json"
      - "05_FORMAL/specifications/LAB-BENCH-001_STATUS.yaml"
    reversibility: reversible
  - decision_id: DEC-009
    date: 2026-07-28
    decision: "Não migrar a revisão canônica: v4.32.2 é oficial, mas nenhum par testado possui cache e smoke integral reproduzíveis."
    rationale: "A revisão atual e a candidata v4.32.1 falharam no mesmo ponto operacional do cache; smokes completos não passaram."
    authority: LAB_LEAN_MATHLIB_COMPATIBILITY_RECOVERY_AUTHORIZED
    affected_paths:
      - "08_REVIEWS/reproducibility/LAB-0.8_LEAN_MATHLIB_COMPATIBILITY_AUDIT.md"
      - "lab0.8-lean-mathlib-compatibility-result.json"
    reversibility: reversible
  - decision_id: DEC-010
    date: 2026-07-30
    decision: "Corrigir apenas na sessão o PATH para disponibilizar uname.exe; não alterar a instalação global nem migrar Mathlib."
    rationale: "A fonte da Mathlib e o probe de subprocessos identificaram uname.exe como recurso ausente; após a correção, o bloqueio residual passou a ser curl/rede."
    authority: LAB_WINDOWS_CACHE_LAUNCH_RECOVERY_AUTHORIZED
    affected_paths:
      - "08_REVIEWS/reproducibility/LAB-0.9_WINDOWS_CACHE_RUNTIME_AUDIT.md"
      - "lab0.9-windows-cache-runtime-result.json"
    reversibility: reversible
  - decision_id: DEC-011
    date: 2026-07-30
    decision: "Reclassificar o erro de criação de processo do LAB-0.9 como resolvido e o bloqueio atual como transferência HTTP parcial."
    rationale: "O cURL Git 8.21.0 foi executado pelo caminho real e transferiu 398 objetos; o bloqueio residual ocorre depois da conexão HTTP, com 2.583 partials/misses."
    authority: LAB_CACHE_NETWORK_RECOVERY_AUTHORIZED
    affected_paths:
      - "08_REVIEWS/reproducibility/LAB-0.10_CACHE_NETWORK_AUDIT.md"
      - "lab0.10-cache-network-result.json"
      - "10_TOOLS/lean-env.ps1"
    reversibility: reversible
  - decision_id: DEC-012
    date: 2026-07-31
    decision: "Congelar RH-NOGO-001 como resultado parcial formal (opcao A)."
    rationale: >
      A camada analitica abstrata esta completa e verificada. A camada
      concreta exigiria infraestrutura Lean para operadores nao limitados,
      resolvente compacto, projetores espectrais, calculo pseudodiferencial,
      lei global de Weyl e Riemann-von Mangoldt. O resultado final excluiria
      apenas uma classe estreita, metade de cujas condicoes eh hipotese
      deste laboratorio, e nao resolveria RH. Opcoes B (continuar), C
      (colaboracao externa) e D (rejeitar a frente) foram descartadas; D em
      particular transformaria trabalho parcial valido em fracasso.
    authority: RH_NOGO_RESEARCH_REVIEW_AUTHORIZED
    affected_paths:
      - "03_MILLENNIUM/01_RIEMANN/RH_NOGO_FINAL_RESEARCH_REVIEW.md"
      - "03_MILLENNIUM/01_RIEMANN/RH_NOGO_FREEZE_RECORD.md"
      - "03_MILLENNIUM/01_RIEMANN/RH_NOGO_REACTIVATION_CRITERIA.md"
      - "03_MILLENNIUM/01_RIEMANN/RH_NOGO_RESULT_BOUNDARY.md"
      - "rh-nogo-research-review-result.json"
    reversibility: reversible
    reactivation_document: "03_MILLENNIUM/01_RIEMANN/RH_NOGO_REACTIVATION_CRITERIA.md"
    approval_status: APPROVED_AFTER_REVIEW
    approved_at: 2026-07-31
    approved_by: proponente do laboratorio
    approval_scope: "autoriza APENAS a preparacao da especificacao"
    approval_record: >
      APPROVED_AFTER_REVIEW - 2026-07-31

            Deviation DEC-012 approved:
            the labctl changes are minimal, literal, deflationary and preserve
            RH-NOGO-001 as NOT_AUTHORIZED / NO_EXECUTION.

            Deviation DEC-013 approved:
            FOUND-SEMIGROUP-002 is accepted as a new scoped work item because
            the remaining canonical queue items were incompatible with the
            cost and dependency criteria of the research review.

            This approval authorizes specification preparation only.
    governance_changes:
      - "labctl: ALLOWED_WORK_STATUS += FROZEN_PARTIAL_RESULT"
      - "labctl: checagem de RH-NOGO-001 aceita SCOPED ou FROZEN_PARTIAL_RESULT (deflacionaria)"
      - "labctl: sequencia de gates admite FOUND-SEMIGROUP-002"
      - "labctl: allowlist += FOUND_SEMIGROUP_002_SPECIFICATION_PREPARATION_AUTHORIZED"
    untouched_safeguards:
      - "RH-NOGO-001 authorization_state permanece NOT_AUTHORIZED"
      - "RH-NOGO-001 execution_state permanece NO_EXECUTION"
  - decision_id: DEC-013
    date: 2026-07-31
    decision: "Selecionar FOUND-SEMIGROUP-002 como proximo work item, apenas para especificacao."
    rationale: >
      Nenhum dos seis itens remanescentes da fila satisfazia os criterios
      positivos do gate: NS-PRESSURE-001 (PDE avancada), PVSNP-PHYS-001
      (outra frente Clay), YM-LIMIT-001 (QFT construtiva), HODGE-CDK-001
      (geometria algebrica), BSD-HYP-MATRIX-001 (custo bibliografico
      very_high), TOE-INTERFACE-001 (TOE, e dependente de uma frente agora
      congelada). Criado item novo em algebra finita e dinamica discreta,
      com infraestrutura Mathlib ja disponivel e acesso alto a
      contraexemplos. Execucao NAO autorizada.
    authority: RH_NOGO_RESEARCH_REVIEW_AUTHORIZED
    affected_paths:
      - "01_PORTFOLIO/RESEARCH_QUEUE.yaml"
      - "LAB_STATE.md"
    reversibility: reversible
    approval_status: APPROVED_AFTER_REVIEW
    approved_at: 2026-07-31
    approved_by: proponente do laboratorio
    approval_scope: "autoriza APENAS a preparacao da especificacao"
    approval_record: >
      APPROVED_AFTER_REVIEW - 2026-07-31

            Deviation DEC-012 approved:
            the labctl changes are minimal, literal, deflationary and preserve
            RH-NOGO-001 as NOT_AUTHORIZED / NO_EXECUTION.

            Deviation DEC-013 approved:
            FOUND-SEMIGROUP-002 is accepted as a new scoped work item because
            the remaining canonical queue items were incompatible with the
            cost and dependency criteria of the research review.

            This approval authorizes specification preparation only.
  - decision_id: DEC-014
    date: 2026-07-31
    decision: >
      Registrar como PENDENTE, NAO implementado, o endurecimento de
      governanca para o novo status FROZEN_PARTIAL_RESULT.
    rationale: >
      FROZEN_PARTIAL_RESULT passou a ser um status globalmente reconhecido
      em ALLOWED_WORK_STATUS. Sem exigencia documental, outro item poderia
      ser congelado sem o mesmo rigor. Uma revisao futura de governanca deve
      exigir que todo item nesse estado possua freeze_record,
      result_boundary, reactivation_criteria e concrete_layer_status.
    authority: null
    implementation_status: PENDING_NOT_IMPLEMENTED
    proposed_requirements:
      - freeze_record
      - result_boundary
      - reactivation_criteria
      - concrete_layer_status
    current_conformance:
      RH-NOGO-001: CONFORMS
    note: >
      RH-NOGO-001, unico item nesse estado, ja possui os quatro campos.
      O endurecimento seria portanto um no-op para o estado atual.
      NAO foi implementado em labctl.py neste gate, por decisao explicita
      do proponente de nao alterar o commit 1576cf1 nem antecipar a revisao
      de governanca.
    affected_paths: []
    reversibility: reversible
