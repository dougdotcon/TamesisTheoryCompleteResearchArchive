gaps:
  - gap_id: NS-GAP-001
    description: "Sinal/dominância da Hessiana de pressão (parte anisotrópica,
      não-local) não provados. Corresponde ao 'Lemma 3.1' do documento
      legado ANALISE_CRITICA_NS.md, lá marcado explicitamente
      '🔴 NÃO PROVADO'. Não é uma identidade de álgebra linear finita
      (essa parte, tr(AΩ)=0 e correlatas, foi verificada nesta sessão,
      ver FORMAL/PressureHessianAlgebra.lean) — é uma estimativa
      não-local (tipo Biot-Savart/Riesz) sobre soluções de
      Navier-Stokes, sem fórmula local fechada."
    status: OPEN
    audited_this_session: true
    finding: "Não resolvido. Avaliado como estruturalmente da mesma
      dificuldade que critérios de regularidade condicional já
      publicados (Constantin-Fefferman 1993, tipo Prodi-Serrin, Evan
      Miller 2020) e nunca verificados a priori para uma solução geral
      -- não uma prova formal de equivalência, mas o motivo do
      stop_condition ter sido acionado para a versão fortalecida da
      hipótese. Ver PROOF_SKETCH.md, seção STOP CONDITION."

  - gap_id: NS-GAP-002
    description: "Controle de enstrofia não foi convertido na norma
      necessária (Passos 4-5 do esboço legado)."
    status: OPEN
    audited_this_session: true
    finding: "Não auditado a fundo nesta rodada porque é condicional a
      NS-GAP-001/NS-GAP-003: Passos 4-5 são Gronwall/Sobolev padrão SE
      o Passo 3 (Stretching Reduction) já estiver estabelecido. Como
      Passo 3 depende do Lemma 3.1 (NS-GAP-001), não há ainda hipótese
      resolvida para converter. Não é um gap novo desta sessão; herdado
      do documento legado."

  - gap_id: NS-GAP-003
    description: "A forma NUA do 'Alignment Gap' (Passo 2 isolado,
      <alpha_1> <= 1-delta_0 sem a componente de taxa do Lemma 3.1) NAO
      e, por si so, uma barreira contra blow-up."
    status: REFUTED
    audited_this_session: true
    finding: "Contraexemplo explícito, verificado por computação nesta
      sessão (não citação de terceiros): na equação de Euler restrita
      (Vieillefosse 1982) -- o truncamento de Navier-Stokes que descarta
      exatamente a parte anisotrópica do Hessiano de pressão -- em 6/6
      condições iniciais aleatórias testadas, o sistema explode em
      tempo finito enquanto o cosseno de alinhamento com e1 tende a
      zero (desalinhamento quase perfeito, muito além de qualquer
      delta_0 < 1 proposto). Ver COUNTEREXAMPLES/restricted_euler_alignment_gap.md
      e COMPUTATION/restricted_euler.py. Escopo do contraexemplo:
      refuta a forma isolada do Passo 2; NÃO refuta Navier-Stokes
      completo, porque o termo descartado é exatamente o termo ao qual
      a hipótese completa atribui o papel regularizador."
    counterexample_path: "COUNTEREXAMPLES/restricted_euler_alignment_gap.md"

  - gap_id: NS-GAP-004
    description: "A parte anisotrópica do Hessiano de pressão não tem
      fórmula local fechada (é uma integral singular tipo
      Biot-Savart/Riesz sobre todo o domínio); nenhuma estimativa
      quantitativa local dela, em termos de A(x), omega(x) e escala
      local, foi encontrada ou produzida nesta sessão."
    status: OPEN
    audited_this_session: true
    finding: "Não é um gap que uma auditoria de literatura possa fechar;
      exigiria pesquisa matemática original (estimativa de integral
      singular, ou um closure model rigoroso -- os closures existentes,
      ex. Chevillard-Meneveau 2006 'Recent Fluid Deformation', são
      estocásticos/fenomenológicos, comparados com DNS, não provados
      como cota rigorosa; os próprios autores notam que características
      em regiões dominadas por rotação não são bem reproduzidas pelo
      modelo). Ver KNOWN_RESULTS_MATRIX.md, linha 10."

  - gap_id: NS-GAP-005
    description: "Enunciado exato de 'Seregin-Sverak: Type I blow-up
      excluído' citado no documento legado como resultado clássico
      100% rigoroso, sem qualificação de hipóteses."
    status: OPEN
    audited_this_session: true
    finding: "Verificação parcial: confirmada a existência e o tema dos
      artigos (Seregin-Sverak 2002 ARMA sobre cotas inferiores de
      pressão; versão axissimétrica 2009), mas não foi possível
      confirmar nesta sessão que a exclusão de blow-up Tipo I é
      incondicional em geral, fora de axissimetria ou hipóteses
      adicionais de pressão. Distinto de Necas-Ruzicka-Sverak 1996
      (Acta Math., confirmado), que exclui apenas a subclasse
      autossimilar. Recomenda-se tratar a linha do documento legado
      como aproximada, não verificada, até confirmação em sessão
      futura com acesso aos artigos originais."
    recheck_2026_08_09_parallel_wave_002: |-
      Reauditoria via WebSearch/WebFetch (abstracts e paginas
      secundarias; sem acesso a texto completo pago). Buscas usadas:
      "Seregin Sverak Navier-Stokes Type I blow-up excluded pressure";
      "Seregin Sverak 2002 ARMA pressure lower bound"; "Seregin Sverak
      axisymmetric 2009 CPDE Type I"; "Koch Nadirashvili Seregin
      Sverak Liouville theorems Navier-Stokes Acta Math 2009";
      "Instantaneous Type I blow-up non-uniqueness Navier-Stokes
      2511.09556". Paginas lidas: abstract/springer-listing de Seregin
      & Sverak, "Navier-Stokes Equations with Lower Bounds on the
      Pressure", ARMA 163(1):65-86 (2002) [texto completo pago, nao
      acessado; abstract/resumos de terceiros apenas]; arXiv
      abs/0804.1803 (= Seregin & Sverak, "On type I singularities of
      the local axi-symmetric solutions of the Navier-Stokes
      equations", Comm. PDE 34(1-3):171-201, 2009); arXiv abs/0709.3599
      (= Koch, Nadirashvili, Seregin & Sverak, "Liouville theorems for
      the Navier-Stokes equations and applications", Acta Math.
      203:83-105, 2009); arXiv abs/2511.09556 (Cheskidov, Dai &
      Palasek, "Instantaneous Type I blow-up and non-uniqueness of
      smooth solutions of the Navier-Stokes equations", nov. 2025,
      preprint).

      Achados: (1) O artigo ARMA 2002 nao e um resultado de "exclusao
      de blow-up Tipo I" per se -- e um criterio de regularidade
      CONDICIONAL: prova que solucoes fracas sao suaves SE a parte
      negativa da pressao for controlada (ou se a parte positiva de
      |v|^2+2p for controlada), uma hipotese adicional sobre a pressao,
      nao uma propriedade automatica de toda solucao. (2) O artigo CPDE
      2009 tem abstract explicito: "Local regularity of axially
      symmetric solutions to the Navier-Stokes equations is studied.
      It is shown that under certain natural assumptions there are no
      singularities of Type I" -- ou seja, e restrito a solucoes
      AXISSIMETRICAS e ainda condicional a "certain natural
      assumptions" nao detalhadas no abstract (seriam necessarias para
      confirmar quais). (3) O artigo relacionado Acta Math. 2009
      (Koch-Nadirashvili-Seregin-Sverak, Liouville) declara
      explicitamente, segundo resumos de terceiros, que "the general
      three-dimensional problem is out of reach of existing
      techniques" e que resultados parciais valem apenas no caso
      axissimetrico -- confirmando que nenhuma das linhas desta familia
      de resultados cobre o caso geral (nao-axissimetrico) de forma
      incondicional. (4) Desenvolvimento recente NAO avaliado pela
      auditoria original: Cheskidov, Dai & Palasek (arXiv:2511.09556,
      nov. 2025, preprint ainda sem confirmacao de revisao por pares)
      afirmam CONSTRUIR, para qualquer dado inicial suave e
      livre-de-divergencia, uma solucao de Navier-Stokes com blow-up
      Tipo I da norma L^infinito em um tempo T*>0 (suave em todo o
      resto do dominio), via nao-unicidade/bifurcacao (uma "cascata de
      energia inversa" instantanea a partir de numero de onda
      infinito), em T^d, d>=2 -- ou seja, um contraexemplo explicito a
      qualquer leitura de "Tipo I excluido" como fato geral
      incondicional. NAO foi possivel confirmar, a partir de abstracts
      e resumos secundarios (sem acesso ao artigo completo), se essas
      solucoes construidas satisfazem a desigualdade de energia local
      (isto e, se sao "suitable weak solutions" na classe a que os
      teoremas de Seregin-Sverak se aplicam) -- portanto nao posso
      afirmar que esse preprint refuta tecnicamente os resultados
      condicionais de Seregin-Sverak, apenas que ele e evidencia forte
      adicional de que nenhuma forma incondicional/geral de "Tipo I
      excluido" e conhecida, e que a paisagem pode estar mudando.

      Veredito: CONFIRMED_CONDITIONAL. Confirmado (via abstracts e
      descricoes de terceiros, nao texto integral) que a exclusao de
      blow-up Tipo I por Seregin-Sverak (e trabalhos relacionados com
      Koch-Nadirashvili) e CONDICIONAL em pelo menos um dos seguintes:
      (a) axissimetria da solucao [CPDE 2009 e Acta Math 2009], e/ou
      (b) uma hipotese adicional explicita sobre a pressao (controle da
      parte negativa) ou "certain natural assumptions" nao totalmente
      especificadas [ARMA 2002, CPDE 2009]. NENHUMA fonte encontrada
      afirma exclusao incondicional de Tipo I para solucoes gerais
      (nao-axissimetricas, sem hipotese extra de pressao); pelo
      contrario, os proprios autores (Koch-Nadirashvili-Seregin-Sverak)
      descrevem o caso 3D geral como "out of reach of existing
      techniques". A linha do documento legado citada em NS-GAP-005
      permanece, portanto, uma OVERCLAIM confirmada: nao deve ser lida
      como resultado classico incondicional. NAO CONFIRMADO nesta
      rodada (falta acesso ao texto integral): o enunciado exato das
      "certain natural assumptions" do CPDE 2009; se o preprint
      Cheskidov-Dai-Palasek (2511.09556) se aplica a classe de solucoes
      cobertas pelos teoremas de Seregin-Sverak; e status de revisao
      por pares desse preprint de nov. 2025.

stop_condition:
  triggered: true
  which_form: "forma fortalecida da hipótese (Passo 1 + Lemma 3.1, com
    componente de taxa) -- não a forma nua (Passo 2 isolado), que foi
    refutada por contraexemplo explícito (NS-GAP-003), satisfazendo
    também o critério de parada por essa via."
  detail: "A versão da hipótese que sobrevive ao contraexemplo desta
    sessão (NS-GAP-003) exige uma cota quantitativa a priori sobre o
    comportamento da solução ate um tempo de blow-up hipotetico -- a
    mesma estrutura de dificuldade de todo criterio de regularidade
    condicional publicado e nunca verificado a priori (Constantin-Fefferman
    1993, tipo Prodi-Serrin, Evan Miller 2020). Nao e uma prova formal
    de equivalencia logica bicondicional a regularidade global; e uma
    avaliacao estrutural que motiva parar em vez de tentar forcar uma
    prova do Lemma 3.1 nesta rodada. Ver PROOF_SKETCH.md."
  action_taken: "PARADO conforme protocolo. Nao foi tentada prova do
    Lemma 3.1/NS-GAP-001/NS-GAP-004 nesta sessão."
