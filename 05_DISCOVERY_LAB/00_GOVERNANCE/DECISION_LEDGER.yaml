  - decision_id: DISC-DEC-051
    date: 2026-08-23
    decision: >
      Autorizar onda 12, continuando o modo padrao de operacao
      multi-linha (DISC-DEC-023), com a onda 11 (DISC-DEC-047/048/049)
      e a onda 10 (DISC-DEC-045/046/050) agora inteiramente fechadas em
      todas as frentes -- 2 frentes matematicas puras independentes,
      ambas reaberturas explicitamente nomeadas como legitimas pelas
      proprias integracoes que as descobriram, cada uma com uma rota
      construtiva ja esbocada por um referee hostil (nao executada,
      apenas apontada). (a) `MK-QUALITATIVE-GEOMETRICITY-ATTEMPT` --
      tentar provar o crescimento geometrico qualitativo de M_K
      (Sigma_K c^K M_K/K! < infinito), a unica obstrucao nomeada
      restante para tornar Teorema E (onda 11 frente a,
      uniform_in_c_attempt) incondicional. O referee de DISC-DEC-049
      (SS6.2, "Constructive note") esbocou, sem executar, uma rota
      plausivel: desenrolar a recursao da Proposicao 6 de Estagio 8
      (error_constant_growth_attempt), C'_r(b) <= (B_r(b)+A_r(b+1)) +
      2*C'_{r-1}(b+1), usando que os dois multiplicadores
      r/(b+r+1) e r/(r+b+2) sao ambos <1, o que propagaria
      geometricidade com um fator extra 2 -- combinado com o limitante
      cru ja provado F_r(2,0) <= 2*phi_r*2^r = O(2^r) via Lema 7
      (PROVADO, exato) de Estagio 8. (b)
      `MCLUST-SHORT-CYCLE-DYNAMICS-ATTEMPT` -- tentar fechar o
      residuo real que phi_REDB (DISC-DEC-050) deixou aberto na
      celula mais extrema testada (b=100,c=1000,rho=0,785, z~-10),
      que o proprio referee da onda 10 frente (a) diagnosticou como
      causado por ciclos-pi curtos (comprimento <b-1): nao e apenas
      que as densidades (2.1)-(2.2) sao aproximadas la (SS3.2 do
      referee ja derivou as formas exatas), e sim que a DINAMICA muda
      nesses ciclos -- o ciclo inteiro e absorvido em R e se torna
      inalcancavel por passos normais. O referee tentou uma correcao
      ingenua (phi_REDX, substituir apenas as densidades medias
      exatas) e ela NAO funcionou (corrige a pior celula mas piora
      duas outras) -- diagnostico explicito do proprio referee de que
      o regime de ciclo curto precisa de um tratamento estrutural, nao
      apenas estatistico.
    rationale: >
      Ambas as frentes sao reaberturas explicitamente nomeadas como
      legitimas pelas proprias integracoes que as descobriram -- a
      onda 11 frente (a) nomeia precisamente a geometricidade
      qualitativa de M_K como a unica obstrucao restante para Teorema
      E incondicional, com uma rota construtiva ja identificada por um
      referee independente que optou por nao executa-la (disciplina de
      escopo do proprio referee, nao um sinal de dificuldade); a onda
      10 frente (a) (agora integrada como DISC-DEC-050) nomeia
      precisamente o residuo de ciclo curto na celula mais extrema como
      aberto, com um diagnostico estrutural claro e uma tentativa
