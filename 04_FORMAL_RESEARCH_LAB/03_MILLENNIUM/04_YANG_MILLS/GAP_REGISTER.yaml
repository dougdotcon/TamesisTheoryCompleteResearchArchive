gaps:
  - gap_id: YM-GAP-001
    description: "Tightness não dá unicidade nem não trivialidade."
    status: OPEN
    audited_by: YM-LIMIT-001
    audit_date: 2026-08-09
    abstract_counterexample: "toyGap (FORMAL/InsufficiencyToyModel.lean, toyGap_no_unique_continuum_limit) -- gap uniforme >= 2 em toda escala, mas subsequencias par/impar convergem para limites distintos (2 e 3); nenhuma unica teoria limite"
    note: "Gap logico confirmado no nivel abstrato (Lean, sem sorry). Nao fechado para a medida real de Yang-Mills -- permanece OPEN."
  - gap_id: YM-GAP-002
    description: "Gap finito-volume não implica gap uniforme no limite."
    status: OPEN
    audited_by: YM-LIMIT-001
    audit_date: 2026-08-09
    abstract_counterexample: "toyFiniteVolumeGap = 1/(n+1) (FORMAL/InsufficiencyToyModel.lean, finite_volume_gap_does_not_survive_without_uniform_bound) -- positivo em todo n, infimo zero"
    note: "Corresponde ao GAP 1/GAP 2 de RECURSOS_PARA_PESQUISA/07_MILLENNIUM_VALIDATION/PROBLEM_04_YANG_MILLS/ANALISE_CRITICA_YM.md (legado, so leitura). Gap logico confirmado no nivel abstrato. Permanece OPEN para a teoria real."
  - gap_id: YM-GAP-003
    description: "Axiomas OS/Wightman e reconstrução não estão estabelecidos."
    status: OPEN
  - gap_id: YM-GAP-004
    description: "Convergência forte de resolvente (ou mesmo convergência em norma) não garante que o gap espectral sobreviva ao limite -- o espectro do limite pode 'contrair repentinamente' mesmo sob convergência forte."
    status: OPEN
    audited_by: YM-LIMIT-001
    audit_date: 2026-08-09
    abstract_counterexample: "Operador de multiplicacao H_n = 0 (+) M_{f_n}, f_n(x)=max(x,1/n) em L^2([0,1]); spec(H_n)={0}U[1/n,1] (gap 1/n>0), H_n -> H em norma, spec(H)=[0,1] (gap fechado). Ver COUNTEREXAMPLES/ABSTRACT_COUNTEREXAMPLES.md#contraexemplo-3."
    note: "NAO formalizado em Lean nesta rodada (infraestrutura de operadores/espectro em L^2 fora do orcamento desta frente). Prova em prosa apoiada em fato padrao de analise espectral (ver REVIEWS/AUDIT_REPORT.md, secao Verificado)."
  - gap_id: YM-GAP-005
    description: "Extensão dos bounds de Balaban (UV stability) de SU(2) para SU(N) geral é citada na literatura secundária como 'por universalidade', sem prova rigorosa fechada."
    status: OPEN
    audited_by: YM-LIMIT-001
    audit_date: 2026-08-09
    note: "Nao verificado nesta sessao (fora de escopo de tempo). Ver KNOWN_RESULTS_MATRIX.md e ASSUMPTIONS.md."
  - gap_id: YM-GAP-006
    description: "Svetitsky-Yaffe (1982) e um resultado de universalidade sobre a transicao de deconfinamento a temperatura finita T>0; nao e, por si, um teorema sobre ausencia de transicao a T=0 no limite euclidiano infinito -- o argumento de interpolacao weak/strong coupling da literatura secundaria usa esse resultado fora do regime em que foi estabelecido."
    status: OPEN
    audited_by: YM-LIMIT-001
    audit_date: 2026-08-09
    note: "Confirmado via WebSearch nesta sessao que o resultado publicado e sobre universalidade de transicao termica (ver REVIEWS/AUDIT_REPORT.md, secao Verificado)."
  - gap_id: YM-GAP-007
    description: "A varredura bibliografica original desta frente (2026-08-09) nao cobriu duas preprints de 2025/2026 que alegam resolucao construtiva completa do problema de existencia e mass gap de Yang-Mills 4D -- achado na revisao adversarial (result_review) da mesma sessao."
    status: OPEN_EXTERNAL_CLAIM_UNVERIFIED
    audited_by: YM-LIMIT-001
    audit_date: 2026-08-09
    external_claims:
      - title: "A Constructive Proof of Existence and Mass Gap for Pure SU(3) Yang-Mills in Four-Dimensional Space-Time"
        arxiv: "2506.00284"
        submitted: "2025-05-30"
        status: "WITHDRAWN pelo arXiv admin (confirmado via WebSearch 2026-08-09) -- motivo da retirada nao verificado por este laboratorio"
      - title: "Reflection-Positive Construction of a Four-Dimensional SU(N) Yang-Mills Theory with Mass Gap and Confinement"
        arxiv: "2606.19362"
        posted: "2026-06-09"
        status: "Publicada, nao retirada, segundo busca desta sessao. NAO revisada por pares confirmada. Alega SU(N) geral, gap uniforme levado ao continuo."
    note: >
      Este laboratorio NAO verifica, endossa, nem refuta nenhuma das duas
      alegacoes -- verificar uma prova construtiva completa de QFT 4D
      esta muito alem do escopo de uma auditoria de literatura (
      bibliographic_cost: very_high ja registrado para esta frente). O
      fato de uma preprint alegando o mesmo resultado ja ter sido
      retirada pelo arXiv e um sinal de cautela, nao uma refutacao da
      outra. Registrado para rastreabilidade futura -- se qualquer uma
      das duas resistir a revisao por pares, isso muda o status de
      YM-LIMIT-001 e possivelmente do proprio Problema do Milenio, e
      deve ser reavaliado num gate proprio, nunca assumido aqui.
    recheck_2026_08_09_parallel_wave_002: >
      Rechecagem de status desta mesma data (DEC-067, frente 3 de 3,
      file-disjoint), via WebSearch/WebFetch nas paginas arXiv abs e
      buscas por autor+titulo. NAO reavalia correcao matematica de
      nenhuma das duas alegacoes -- apenas status publico verificavel.

      (1) arXiv:2506.00284 (D.C. Jacobsen) -- permanece WITHDRAWN,
      ainda na v2 (submetida 2025-06-13). Novidade: o texto exato da
      nota do admin do arXiv agora foi lido diretamente na pagina abs
      -- "This submission has been withdrawn because it does not meet
      arXiv's research content quality standards." Isto e uma
      categoria administrativa padrao do arXiv, nao uma refutacao
      matematica especifica nem um erratum do autor; nenhum comentario
      adicional, errata ou refutacao de terceiros foi encontrado.
      Campo "Comments" vazio, sem journal-ref.

      (2) arXiv:2606.19362 (Mir Faizal, Arshid Shabir) -- permanece
      unica versao (v1, 2026-06-09), NAO retirada. MUDANCA DE STATUS
      relevante: a pagina abs do arXiv agora exibe um campo
      journal-ref -- "Fortsch. Phys. 74 (2026) 4, e70097" -- com DOI
      10.1002/prop.70097, correspondendo a um artigo com o mesmo
      titulo em Fortschritte der Physik (Progress of Physics),
      periodico da Wiley-VCH com revisao por pares single-blind
      (confirmado via busca independente: listagem Wiley Online
      Library para o DOI, entrada ResearchGate e listagem DeepDyve,
      todas citando volume 74, numero 4, artigo e70097). Isto e
      evidencia publica de que o artigo passou por um processo de
      revisao por pares e foi aceito nesse periodico -- este
      laboratorio NAO avalia se essa revisao foi adequada ao escopo da
      alegacao (prova construtiva de mass gap 4D), apenas registra o
      fato verificavel da publicacao. Nao foram encontradas citacoes
      independentes de terceiros discutindo ou contestando o
      resultado; buscas por "Faizal Shabir Yang-Mills" retornam
      principalmente listagens do proprio artigo e de uma serie
      relacionada de quatro artigos dos mesmos autores no
      International Journal of Geometric Methods in Modern Physics
      (2026), citada nos proprios "Comments" do preprint.

      (3) Busca por novas alegacoes 2026: nenhuma nova submissao em
      arXiv (fora as duas ja registradas) foi encontrada alegando
      resolucao construtiva do problema. Fora do arXiv, buscas amplas
      encontraram alegacoes adicionais de baixa credibilidade em
      servidores de preprint sem gate editorial: "Complete Resolution
      to Yang-Mills Existence and Mass Gap in MES Cosmology, and a
      Complete United Field Theory" (Preprints.org, manuscript
      202506.2484) e "All Millennium Problems Solved" (Preprints.org,
      manuscript 202507.2187, marcado "Not peer-reviewed version"),
      alem de uma alegacao de marco 2026 por Vladimir Leonov via
      "Quantum Superunification Theory" mencionada em resultados de
      busca. Nenhuma delas esta em arXiv nem tem journal-ref
      verificado; nao sao adicionadas como external_claims formais
      nesta rechecagem porque a triagem completa desses servidores
      esta fora do escopo desta frente pontual -- registradas aqui
      apenas para rastreabilidade caso reapareçam numa auditoria
      futura. Tambem foi localizado um artigo critico (nao alegando
      solucao) de M. K. Madisa examinando o problema.

      RESUMO: YM-GAP-007 permanece OPEN_EXTERNAL_CLAIM_UNVERIFIED. A
      unica mudanca de status factual desde 2026-08-09 (auditoria
      original, mesma data civil, sessao anterior) e a aparicao do
      journal-ref para 2606.19362. Isso NAO confirma nem refuta a
      alegacao matematica -- apenas eleva seu status de rastreamento
      de "preprint nao revisado" para "publicado em periodico com
      revisao por pares conhecida". Nenhuma mudanca no status de
      2506.00284 alem do texto exato do motivo administrativo da
      retirada, que continua sem detalhe matematico.
