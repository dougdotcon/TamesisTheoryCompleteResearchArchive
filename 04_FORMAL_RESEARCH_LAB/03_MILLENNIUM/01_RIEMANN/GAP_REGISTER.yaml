schema: tamesis-gap-register/1
work_item_id: RH-NOGO-001
gaps:
  - gap_id: GAP-RH-001
    description: >
      Formulação exata da classe de operadores: a Classe W (W1–W8) está
      especificada em OPERATOR_CLASS.md; a redação final em linguagem de
      análise funcional (domínios, extensão de Friedrichs) deve ser
      revisada no gate de prova.
    severity: medium
    status: SPECIFIED_PENDING_REVIEW
    blocking: false
  - gap_id: GAP-RH-002
    description: >
      Fonte primária para a versão específica da lei de Weyl usada (W8):
      transcrever de Hörmander 1968 o enunciado exato (escalar vs fibrado,
      diferencial vs pseudodiferencial, forma do resto) antes do gate de
      prova do resultado completo.
    severity: high
    status: AUDITED_INSUFFICIENT
    blocking: "bloqueia o gate de prova do resultado completo; NÃO bloqueia o núcleo abstrato, já verificado"
    audit_finding: >
      Hörmander 1968 foi obtido e auditado (HORMANDER_1968_AUDIT.md). O
      artigo prova a lei de Weyl LOCAL da função espectral na diagonal
      (eq. 5.3), mas NÃO enuncia a contagem global N_P(Λ) ~ C_P Λ^(d/m).
      É necessária fonte adicional. Ver UNRESOLVED_SOURCE_QUESTIONS.md Q1.
  - gap_id: GAP-RH-003
    description: >
      Tradução da contagem espectral para o sublema abstrato: definir em
      Lean a função de contagem a partir de um multiconjunto/sequência de
      autovalores e provar que as hipóteses A/B correspondem às leis
      assintóticas declaradas.
    severity: medium
    status: OPEN
    blocking: false
  - gap_id: GAP-RH-004
    description: >
      Disponibilidade das ferramentas assintóticas na Mathlib: verificada
      positivamente em 2026-07-31 (LEAN_FEASIBILITY.md); riscos residuais
      de contabilidade de filtros e rpow registrados.
    severity: low
    status: CLOSED_BY_FORMALIZATION
    blocking: false
    closure_evidence: >
      Nucleo ASYM-NOGO-001 formalizado e compilado em 2026-07-31; as
      ferramentas previstas foram efetivamente usadas. Ver
      ASYM_NOGO_001_THEOREM_MAP.md.
  - gap_id: GAP-RH-005
    description: >
      Tratamento de multiplicidades: a coincidência é de multiconjuntos;
      formalização futura deve escolher representação (sequência monótona
      com repetição vs Multiset) e mantê-la coerente.
    severity: medium
    status: OPEN
    blocking: false
  - gap_id: GAP-RH-006
    description: >
      Dependência da RH: resolvida — o enunciado é incondicional
      (DEFINITIONS.md, questão 4). Nenhuma hipótese sobre a localização
      dos zeros é usada.
    severity: low
    status: RESOLVED_INDEPENDENT
    blocking: false
  - gap_id: GAP-RH-007
    description: >
      Novidade bibliográfica: a observação subjacente (contagem T log T
      não é lei de potência de Weyl) é folclore da área, discutida ao
      menos desde Berry–Keating 1999. Nenhuma formulação idêntica com
      classe explícita e formalização foi localizada, mas a busca não foi
      exaustiva. O resultado NÃO deve ser apresentado como novo em
      matemática.
    severity: medium
    status: OPEN
    blocking: false
  - gap_id: GAP-RH-009
    description: >
      Fibrados vetoriais (W2): Hörmander 1968 p.216 cobre sistemas apenas
      com autovalores DISTINTOS do símbolo principal; para multiplicidade,
      "no information beyond" Agmon-Kannai. A Classe W declara fibrados
      hermitianos gerais.
    severity: high
    status: OPEN
    blocking: false
  - gap_id: GAP-RH-010
    description: >
      Auto-adjunção (W5): a Classe W exige essencial auto-adjunção;
      Hörmander toma UMA extensão de Friedrichs ("at least one self-adjoint
      extension"). Como o espectro depende da extensão, o enunciado precisa
      dizer qual.
    severity: medium
    status: CLOSED_BY_REFORMULATION
    blocking: false
    closure_evidence: >
      SELF_ADJOINT_REALIZATION_DECISION.md: a hipotese minima e
      "realizacao auto-adjunta positiva", nao essencial auto-adjuncao.
      Formulacao adotada em W_ELLIPTIC_CLASS.md (E4).
  - gap_id: GAP-RH-011
    description: >
      Paridade da ordem m (W3): elipticidade mais positividade com símbolo
      principal real forçam m par para d >= 2. OPERATOR_CLASS.md admite
      m >= 1 qualquer, tornando a classe vazia para m ímpar. Defeito de
      formulação, não de resultado.
    severity: low
    status: CLOSED_BY_REFORMULATION
    blocking: false
    closure_evidence: >
      ORDER_PARITY_AUDIT.md: decisao PSEUDODIFFERENTIAL_POSITIVE_ORDER.
      Ordem real m > 0 elimina a paridade. W-ELLIPTIC v2 (E6).
  - gap_id: GAP-RH-012
    description: >
      Discretude do espectro (W7): não provada nem enunciada em Hörmander
      1968. Consequência padrão de elipticidade mais compacidade, mas
      requer fonte.
    severity: high
    status: PARTIALLY_SUPPORTED
    blocking: false
    audit_finding: >
      Coriasco-Doll 2020, Secao 3, estabelece a cadeia resolvente compacto
      -> base ortonormal de autofuncoes -> 0 < lambda_1 <= ... -> +infinito,
      mas no contexto SG proprio deles. Para variedade compacta o analogo e
      teoria eliptica padrao, NAO lida em fonte obtida.
  - gap_id: GAP-RH-008
    description: >
      Escopo das rotas de escape: mapa registrado em ESCAPE_ROUTES.md
      (14 rotas); revisão adversarial futura deve checar se alguma rota
      relevante ficou de fora.
    severity: medium
    status: SPECIFIED_PENDING_REVIEW
    blocking: false
legacy_gaps_superseded:
  - "RH-GAP-001 → GAP-RH-001 (classe agora especificada)"
  - "RH-GAP-002 (cancelamento não circular) → sem objeto nesta rota: não há fórmula de traço; princípio preservado em STOP_CONDITIONS.md itens 2–3"
  - "RH-GAP-003 → GAP-RH-007"
  - gap_id: GAP-RH-013
    description: >
      Atribuição bibliográfica: a literatura moderna (Coriasco-Doll 2020,
      p.1) atribui a lei de Weyl GLOBAL a Hörmander 1968 [15], artigo que
      enuncia apenas a lei LOCAL. A atribuição é matematicamente
      defensável mas bibliograficamente imprecisa. Regra adotada: citar
      Hörmander pelo resultado local; a lei global por Coriasco-Doll/Ivrii
      ou pela ponte explícita.
    severity: informational
    status: RESOLVED_BY_CITATION_RULE
    blocking: false
  - gap_id: GAP-RH-014
    description: >
      Positividade da constante global C_P > 0 não é afirmada por nenhuma
      fonte obtida. Argumento elementar registrado em
      GLOBAL_WEYL_CONSTANT.md, não citado nem demonstrado. Sem C_P > 0 a
      pertinência a W-POWER falha.
    severity: medium
    status: OPEN
    blocking: false
