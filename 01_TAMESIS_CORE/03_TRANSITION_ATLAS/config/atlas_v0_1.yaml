atlas_version: "0.1"
status: "auditable_hypothesis_registry"
epistemic_statuses:
  - metaphorical
  - conjectured
  - mathematically_specified
  - computationally_reproduced
  - phenomenologically_constrained
  - preregistered_test
  - observational_anomaly
  - transition_detected
  - independently_replicated
  - established_regime_boundary
  - falsified
  - superseded
transition_types:
  - isomorphism
  - reduction
  - singular_limit
  - coarse_graining
  - phase_transition
  - symmetry_breaking
  - environmental_decoherence
  - intrinsic_collapse
  - emergence
  - duality
  - effective_description_change
  - unknown
reversibility_classes:
  - reversible
  - effectively_irreversible
  - fundamentally_irreversible
  - non_markovian
  - unknown
promotion_rules:
  mathematically_specified: "equations, symbol definitions and validity domain are required"
  computationally_reproduced: "executable code, deterministic inputs and hashes are required"
  preregistered_test: "frozen protocol and falsification criterion are required"
  transition_detected: "prospective observation, nuisance control and rival rejection are required"
  independently_replicated: "independent source and protocol-compatible reproduction are required"
  established_regime_boundary: "multiple independent replications and consolidated domain are required"
