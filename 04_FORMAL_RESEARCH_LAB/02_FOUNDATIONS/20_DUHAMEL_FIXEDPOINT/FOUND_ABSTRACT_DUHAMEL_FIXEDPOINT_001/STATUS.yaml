result:
  main_theorem: exists_unique_mild_solution
  statement: >
    Given {L : R>=0} (hB : LipschitzWith L B) (u0 : L^2) {T : R} (hT0 : 0 < T)
    (hTL : T * L < 1), there exists a UNIQUE bounded continuous curve
    u : Set.Icc 0 T ->b L^2 such that for all t in [0,T],
    u t = duhamelTerm B t u0 (IccExtend u) t -- i.e. a unique local mild
    solution to the abstract semilinear equation, ONLY under the explicit,
    unverified-for-any-concrete-case hypothesis that B is globally Lipschitz.
  key_objects:
    - "phiTotal / phiTotal_continuous / phiTotal_eq_duhamelTerm: totalized
       Duhamel map via Set.IccExtend, faithful to the real duhamelTerm for t>=0"
    - "PhiMap: the actual self-map on Set.Icc 0 T ->b L^2"
    - "norm_phiTotal_sub_le / dist_PhiMap_le: the contraction estimate,
       constant exactly T*L, hand-verified by the adversarial reviewer"
    - "contractingWith_PhiMap: packaged into Mathlib's ContractingWith,
       K = T*L < 1 via Real.toNNReal_lt_one"
  method: "Mathlib's ContractingWith.fixedPoint (Banach fixed point theorem),
    applied to the Duhamel map on Set.Icc 0 T ->b Lp F 2 (BoundedContinuousFunction,
    complete since codomain is complete and domain compact)"
  B_hypothesis: "globally Lipschitz (LipschitzWith L B), an explicit theorem
