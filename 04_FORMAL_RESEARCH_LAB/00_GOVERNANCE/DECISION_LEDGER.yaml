      erros de sintaxe no rascunho inicial, corrigidos: variante errada
      do lema de auto-produto-interno (parte real vs valor em 𝕜);
      RCLike.ofReal nao sintaticamente igual a Complex.ofReal (armadilha
      ja documentada em ORTHOGONAL_CLOSURE.md), ring falhando numa
      igualdade trivial disfarcada por casts diferentes, trocado por
      simp; map_sub nao se aplica a toL2 (funcao comum, nao hom
      empacotado), resolvido com lema auxiliar toL2_sub derivado de
