gaps:
  - gap_id: PNP-GAP-001
    description: "Ponte universal para máquinas de Turing ausente."
    status: OPEN
    detail: >
      Nenhuma fonte encontrada nesta sessão (WebSearch, 2026-08-09) estabelece
      uma "ponte de simulação" (ver DEFINITIONS.md secao 3) universal, isto e,
      valida para uma tripla (E,M,R) capaz de separar P_phys/NP_phys de forma
      que isso implique uma separacao superpolinomial classica de maquinas de
      Turing. Resultados proximos encontrados sao condicionais: Burgisser-
      Cucker 2006 (BSS sobre C vs classico, sob GRH) e Maass-Orponen 1998
      (ruido analogico colapsa o modelo A poder classico, nao o contrario).
    stop_condition_hit: true
    evidence:
      - "KNOWN_RESULTS_MATRIX.md items 3, 4"
      - "PROOF_SKETCH.md secao 3(ii)"
    audited_by: PVSNP-PHYS-001
    audited_at: "2026-08-09"
  - gap_id: PNP-GAP-002
    description: "Dependência de codificação e recursos precisa ser formalizada."
    status: OPEN
    detail: >
      DEFINITIONS.md secao 4 lista 4 triplas (E,M,R) da literatura (BSS
      sobre R/C, ARNN de Siegelmann-Sontag, modelo de ruido de Maass-Orponen,
      recozimento sobre vidro de spin de Talagrand) que definem nocoes de
      "polinomial" mutuamente nao equivalentes sem hipotese adicional. Nao
      ha, na literatura pesquisada, uma codificacao/modelo fisico canonico
      para "complexidade fisica" analogo ao alfabeto binario fixo usado por
      P/NP classicos.
    stop_condition_hit: true
    evidence:
      - "DEFINITIONS.md secao 4-5"
      - "PROOF_SKETCH.md secao 3(i)"
    audited_by: PVSNP-PHYS-001
    audited_at: "2026-08-09"
  - gap_id: PNP-GAP-003
    description: "\"Physical Computation Axiom\" (PCA) do documento legado não localizado como termo/resultado da literatura externa."
    status: OPEN
    detail: >
      RECURSOS_PARA_PESQUISA/.../ANALISE_CRITICA_PNP.md (legado, so leitura)
      cita um "Physical Computation Axiom" como base de uma alegacao anterior
      de "ZFC + PCA |- P!=NP". Busca nesta sessao (WebSearch, 2026-08-09) nao
      localizou o termo em Aaronson 2005, Blum-Shub-Smale 1998, Maass-Orponen
      1998, Burgisser-Cucker 2006 ou Deutsch 1985. Nao classificavel como
      resultado verificado nem aproximado de fonte externa; tratado como
      interno ao legado ate que uma fonte primaria seja localizada. Por
      AGENTS.md ("nao inventar referencias"), qualquer uso futuro do PCA como
      se fosse resultado citavel da literatura deve permanecer bloqueado ate
      resolucao deste gap.
    stop_condition_hit: false
    evidence:
      - "ASSUMPTIONS.md secao 3"
      - "KNOWN_RESULTS_MATRIX.md item 9"
    audited_by: PVSNP-PHYS-001
    audited_at: "2026-08-09"
  - gap_id: PNP-GAP-004
    description: "Reducao k-SAT -> vidro de spin com gap espectral universal, citada no documento legado como \"provado\", não localizada como teorema geral."
    status: OPEN
    detail: >
      Talagrand 2006 (Ann. of Math. 163:221-263, verificado nesta sessao)
      prova a formula de Parisi para a energia livre do MODELO SK em si, nao
      uma reducao geral de instancias k-SAT a vidros de spin com gap
      espectral exp(-alpha N). O documento legado atribui esta reducao a
      "Talagrand/Parisi" sem citacao localizavel para a reducao especifica.
    stop_condition_hit: false
    evidence:
      - "KNOWN_RESULTS_MATRIX.md item 10"
      - "REVIEWS/AUDIT_REPORT.md secao Aproximado"
    audited_by: PVSNP-PHYS-001
    audited_at: "2026-08-09"
